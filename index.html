<script type="module">

// Inventário, Usuários, Relatórios) continua rodando 100% como está,

// ninguém perde acesso a nada enquanto reconstruímos aos poucos.
// As telas já reconstruídas (Lançamento, Equipamentos, Manutenções)
// rodam nativas, fora do iframe.
// =====================================================================
import { h, render } from 'https://esm.sh/preact@10.19.6';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.19.6/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const html = htm.bind(h);
const sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---------- helpers ----------
function fmtDate(d) { if (!d) return '-'; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function fmtBRL(v) { return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function normalize(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }

const F = "'Inter', -apple-system, sans-serif";

// ---------- estilos compartilhados ----------
const S = {
  input: { width: '100%', border: '1px solid var(--border)', borderRadius: 7, padding: '9px 11px', fontSize: 13.5, color: 'var(--ink)', fontFamily: 'inherit', background: '#fff', boxSizing: 'border-box' },
  label: { fontSize: 12, fontWeight: 600, color: 'var(--ink-soft)', margin: '10px 0 6px', display: 'block' },
  row2: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 },
  btnPrimary: { display: 'inline-flex', alignItems: 'center', gap: 6, background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 7, padding: '9px 15px', fontWeight: 600, fontSize: 13, cursor: 'pointer' },
  btnGhost: { display: 'inline-flex', alignItems: 'center', gap: 6, background: '#fff', color: 'var(--ink)', border: '1px solid var(--border)', borderRadius: 7, padding: '9px 15px', fontWeight: 600, fontSize: 13, cursor: 'pointer' },
  linkBtn: { background: 'none', border: 'none', color: 'var(--accent)', fontWeight: 600, fontSize: 12.5, cursor: 'pointer' },
  panel: { background: '#fff', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden' },
  panelHeader: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 18px', borderBottom: '1px solid var(--border)' },
  table: { width: '100%', borderCollapse: 'collapse', fontSize: 13.5 },
  th: { textAlign: 'left', padding: '10px 18px', fontSize: 11.5, fontWeight: 600, color: 'var(--ink-soft)', textTransform: 'uppercase', letterSpacing: '0.03em', borderBottom: '1px solid var(--border)', whiteSpace: 'nowrap' },
  tr: { borderBottom: '1px solid var(--border)', cursor: 'pointer' },
  td: { padding: '12px 18px', color: 'var(--ink)', whiteSpace: 'nowrap' },
  empty: { padding: '40px 18px', textAlign: 'center', color: 'var(--ink-soft)', fontSize: 13.5 },
  formCard: { background: '#fff', border: '1px solid var(--border)', borderRadius: 10, padding: 20, maxWidth: 560 },
  topbar: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', padding: '22px 28px 18px', flexShrink: 0, gap: 12, flexWrap: 'wrap' },
  h1: { fontSize: 20, fontWeight: 700, color: 'var(--ink)', margin: 0 },
  content: { padding: '0 28px 28px', flex: 1, overflowY: 'auto' },
  toast: { position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', background: 'var(--ink)', color: '#fff', padding: '10px 18px', borderRadius: 8, fontSize: 13, boxShadow: '0 6px 20px rgba(0,0,0,0.25)', zIndex: 9000 },
  errBox: { background: 'var(--danger-soft)', border: '1px solid #FECACA', color: '#991B1B', borderRadius: 8, padding: '10px 14px', fontSize: 13, marginBottom: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
};

function Badge({ label, fg, bg }) {
  return html`<span style=${{ fontSize: 11, fontWeight: 700, padding: '2px 9px', borderRadius: 999, color: fg, background: bg, whiteSpace: 'nowrap' }}>${label}</span>`;
}

// =====================================================================
// LOGIN
// =====================================================================
function Login() {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(ev) {
    ev.preventDefault();
    setErr(''); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
    setBusy(false);
    if (error) setErr('E-mail ou senha incorretos.');
  }

  return html`
    <div style=${{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <form onSubmit=${submit} style=${{ background: '#fff', border: '1px solid var(--border)', borderRadius: 14, padding: '32px 28px', width: 380, maxWidth: '100%', boxShadow: '0 8px 30px rgba(0,0,0,0.08)' }}>
        <div style=${{ width: 40, height: 40, borderRadius: 10, background: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, marginBottom: 14 }}>📦</div>
        <h1 style=${{ fontSize: 19, fontWeight: 700, margin: '0 0 4px' }}>Sistema</h1>
        <p style=${{ fontSize: 13, color: 'var(--ink-soft)', margin: '0 0 20px' }}>Entre com sua conta de funcionário.</p>
        ${err && html`<div style=${S.errBox}>${err}</div>`}
        <label style=${S.label}>E-mail</label>
        <input type="email" value=${email} onInput=${(e) => setEmail(e.target.value)} style=${S.input} required autofocus />
        <label style=${S.label}>Senha</label>
        <input type="password" value=${senha} onInput=${(e) => setSenha(e.target.value)} style=${S.input} required />
        <button type="submit" style=${{ ...S.btnPrimary, width: '100%', justifyContent: 'center', marginTop: 18, padding: '11px 0' }} disabled=${busy}>${busy ? 'Entrando…' : 'Entrar'}</button>
      </form>
    </div>
  `;
}

// =====================================================================
// SELETOR DE PRODUTO (usado no Lançamento)
// =====================================================================
function ProdutoPicker({ produtos, value, onChange }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const selected = (produtos || []).find((p) => p.codigo === Number(value));
  const label = open ? query : selected ? `#${String(selected.codigo).padStart(3, '0')} · ${selected.produto}` : '';
  const results = useMemo(() => {
    const q = normalize(query);
    const list = produtos || [];
    if (!q) return list.slice(0, 40);
    return list.filter((p) => normalize(p.produto).includes(q) || String(p.codigo).includes(query)).slice(0, 40);
  }, [produtos, query]);
  return html`
    <div style=${{ position: 'relative' }}>
      <input
        style=${S.input}
        placeholder="Buscar produto…"
        value=${label}
        onFocus=${(e) => { setOpen(true); setQuery(''); e.target.select(); }}
        onInput=${(e) => { setQuery(e.target.value); setOpen(true); }}
        onBlur=${() => setTimeout(() => setOpen(false), 150)}
      />
      ${open && html`
        <div style=${{ position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, boxShadow: '0 10px 30px rgba(0,0,0,0.12)', maxHeight: 220, overflowY: 'auto', zIndex: 20 }}>
          ${results.length === 0 && html`<div style=${{ padding: 12, fontSize: 12.5, color: 'var(--ink-soft)' }}>Nenhum produto encontrado.</div>`}
          ${results.map((p) => html`
            <div key=${p.codigo} onMouseDown=${() => { onChange(p.codigo); setOpen(false); }}
              style=${{ padding: '8px 12px', cursor: 'pointer', borderBottom: '1px solid var(--bg)', fontSize: 13 }}>
              <div style=${{ fontWeight: 500 }}>${p.produto}</div>
              <div style=${{ fontSize: 11, color: 'var(--ink-soft)' }}>#${String(p.codigo).padStart(3, '0')} · saldo ${p.saldo ?? '—'} ${p.unidade || ''}</div>
            </div>
          `)}
        </div>
      `}
    </div>
  `;
}

// =====================================================================
// TELA: LANÇAMENTO
// =====================================================================
function LancamentoScreen() {
  const [produtos, setProdutos] = useState(null);
  const [tipo, setTipo] = useState('entrada');
  const [codigo, setCodigo] = useState('');
  const [quantidade, setQuantidade] = useState('');
  const [valor, setValor] = useState('');
  const [marca, setMarca] = useState('');
  const [data, setData] = useState(todayISO());
  const [lote, setLote] = useState('');
  const [validade, setValidade] = useState('');
  const [motivoEntrada, setMotivoEntrada] = useState('compra');
  const [areaFinalidade, setAreaFinalidade] = useState('');
  const [solicitante, setSolicitante] = useState('');
  const [notaFiscal, setNotaFiscal] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');

  async function loadProdutos() {
    const { data, error } = await sb.from('product_balances').select('*');
    if (!error) setProdutos(data || []);
  }
  useEffect(() => { loadProdutos(); }, []);

  const produtoSel = (produtos || []).find((p) => p.codigo === Number(codigo));

  function resetForm() {
    setCodigo(''); setQuantidade(''); setValor(''); setMarca('');
    setLote(''); setValidade(''); setAreaFinalidade(''); setSolicitante(''); setNotaFiscal('');
  }

  async function submit(ev) {
    ev.preventDefault();
    setErr(''); setMsg('');
    if (!produtoSel || !quantidade || Number(quantidade) <= 0) { setErr('Escolha um produto e informe a quantidade.'); return; }
    if (tipo === 'saida') {
      if (!areaFinalidade.trim()) { setErr('Informe a área/finalidade da saída.'); return; }
      if (Number(quantidade) > Number(produtoSel.saldo)) { setErr(`Saldo insuficiente: "${produtoSel.produto}" tem ${produtoSel.saldo} em estoque.`); return; }
    }
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const criado_por = userData?.user?.email || '';
    const payload = {
      data,
      tipo,
      codigo: produtoSel.codigo,
      produto: produtoSel.produto,
      quantidade: Number(quantidade),
      valor: Number(valor) || 0,
      valor_total: Number(((Number(valor) || 0) * Number(quantidade)).toFixed(2)),
      marca: marca.trim().toUpperCase(),
      categoria: produtoSel.categoria,
      nota_fiscal: notaFiscal.trim(),
      criado_por,
    };
    if (tipo === 'entrada') {
      payload.lote = lote.trim().toUpperCase();
      payload.validade = validade || null;
      payload.motivo_entrada = motivoEntrada;
    } else {
      payload.area_finalidade = areaFinalidade.trim().toUpperCase();
      payload.solicitante = solicitante.trim().toUpperCase();
    }
    const { error } = await sb.from('movements').insert([payload]);
    setBusy(false);
    if (error) { setErr('Não foi possível salvar o lançamento.'); return; }
    await loadProdutos();
    setMsg(`${tipo === 'entrada' ? 'Entrada' : 'Saída'} registrada: ${produtoSel.produto}`);
    resetForm();
    setTimeout(() => setMsg(''), 3000);
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Lançamento</h1></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}
      <form style=${S.formCard} onSubmit=${submit}>
        <div style=${{ display: 'flex', border: '1px solid var(--border)', borderRadius: 7, overflow: 'hidden', marginBottom: 4 }}>
          <button type="button" onClick=${() => setTipo('entrada')} style=${{ flex: 1, border: 'none', padding: '9px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', background: tipo === 'entrada' ? 'var(--success-soft)' : '#fff', color: tipo === 'entrada' ? 'var(--success)' : 'var(--ink-soft)' }}>Entrada</button>
          <button type="button" onClick=${() => setTipo('saida')} style=${{ flex: 1, border: 'none', padding: '9px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', background: tipo === 'saida' ? 'var(--danger-soft)' : '#fff', color: tipo === 'saida' ? 'var(--danger)' : 'var(--ink-soft)' }}>Saída</button>
        </div>

        <label style=${S.label}>Produto</label>
        <${ProdutoPicker} produtos=${produtos} value=${codigo} onChange=${setCodigo} />

        <div style=${S.row2}>
          <div>
            <label style=${S.label}>Quantidade</label>
            <input type="number" min="0.01" step="0.01" value=${quantidade} onInput=${(e) => setQuantidade(e.target.value)} style=${S.input} required />
          </div>
          <div>
            <label style=${S.label}>Valor unitário</label>
            <input type="number" min="0" step="0.01" value=${valor} onInput=${(e) => setValor(e.target.value)} style=${S.input} placeholder="opcional" />
          </div>
        </div>

        <label style=${S.label}>Marca</label>
        <input value=${marca} onInput=${(e) => setMarca(e.target.value)} style=${S.input} placeholder="opcional" />

        ${tipo === 'entrada' ? html`
          <label style=${S.label}>Motivo da entrada</label>
          <select style=${S.input} value=${motivoEntrada} onChange=${(e) => setMotivoEntrada(e.target.value)}>
            <option value="compra">Compra</option>
            <option value="doacao">Doação</option>
            <option value="devolucao">Devolução</option>
            <option value="outro">Outro</option>
          </select>
          <div style=${S.row2}>
            <div>
              <label style=${S.label}>Lote</label>
              <input value=${lote} onInput=${(e) => setLote(e.target.value)} style=${S.input} placeholder="opcional" />
            </div>
            <div>
              <label style=${S.label}>Validade</label>
              <input type="date" value=${validade} onInput=${(e) => setValidade(e.target.value)} style=${S.input} />
            </div>
          </div>
        ` : html`
          <div style=${S.row2}>
            <div>
              <label style=${S.label}>Área / Finalidade *</label>
              <input value=${areaFinalidade} onInput=${(e) => setAreaFinalidade(e.target.value)} style=${S.input} required />
            </div>
            <div>
              <label style=${S.label}>Solicitante</label>
              <input value=${solicitante} onInput=${(e) => setSolicitante(e.target.value)} style=${S.input} placeholder="opcional" />
            </div>
          </div>
        `}

        <div style=${S.row2}>
          <div>
            <label style=${S.label}>Data</label>
            <input type="date" value=${data} onInput=${(e) => setData(e.target.value)} style=${S.input} />
          </div>
          <div>
            <label style=${S.label}>Nota fiscal</label>
            <input value=${notaFiscal} onInput=${(e) => setNotaFiscal(e.target.value)} style=${S.input} placeholder="opcional" />
          </div>
        </div>

        <div style=${{ display: 'flex', justifyContent: 'flex-end', marginTop: 18 }}>
          <button type="submit" style=${S.btnPrimary} disabled=${busy}>${busy ? 'Salvando…' : 'Registrar'}</button>
        </div>
      </form>
    </div>
  `;
}

// =====================================================================
// TELA: ESTOQUE (lista de produtos, saldo, cadastro/edição)
// =====================================================================
function getMinimo(p) { return p.estoque_minimo != null ? Number(p.estoque_minimo) : 5; }
function isLow(p) { return (Number(p.saldo) || 0) <= getMinimo(p); }

function EstoqueScreen({ role }) {
  const isAdmin = role === 'admin';
  const [produtos, setProdutos] = useState(null);
  const [categorias, setCategorias] = useState(null);
  const [unidades, setUnidades] = useState(null);
  const [fornecedores, setFornecedores] = useState(null);

  const [filtroCategoria, setFiltroCategoria] = useState('todos');
  const [busca, setBusca] = useState('');
  const [soBaixo, setSoBaixo] = useState(false);

  const [editando, setEditando] = useState(null); // null = lista
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');

  async function loadProdutos() {
    const { data, error } = await sb.from('product_balances').select('*');
    if (error) { setErr('Não foi possível carregar o estoque.'); return; }
    setProdutos(data || []);
  }
  async function loadApoio() {
    const [{ data: cat }, { data: uni }, { data: forn }] = await Promise.all([
      sb.from('categorias').select('*').order('nome'),
      sb.from('unidades').select('*').order('nome'),
      sb.from('fornecedores').select('*').order('nome'),
    ]);
    setCategorias(cat || []);
    setUnidades(uni || []);
    setFornecedores(forn || []);
  }
  useEffect(() => { loadProdutos(); loadApoio(); }, []);

  function nomeCategoria(chave) {
    const c = (categorias || []).find((x) => x.chave === chave);
    return c ? c.nome : (chave || '—');
  }

  const listaFiltrada = useMemo(() => {
    const q = normalize(busca);
    return (produtos || [])
      .filter((p) => filtroCategoria === 'todos' || p.categoria === filtroCategoria)
      .filter((p) => !soBaixo || isLow(p))
      .filter((p) => !q || normalize(p.produto).includes(q) || String(p.codigo).includes(busca))
      .sort((a, b) => a.produto.localeCompare(b.produto));
  }, [produtos, filtroCategoria, busca, soBaixo]);

  const stats = useMemo(() => {
    if (!produtos) return { total: 0, baixo: 0, valorTotal: 0 };
    let baixo = 0, valorTotal = 0;
    produtos.forEach((p) => { if (isLow(p)) baixo++; valorTotal += (Number(p.saldo) || 0) * (Number(p.custo_medio) || 0); });
    return { total: produtos.length, baixo, valorTotal };
  }, [produtos]);

  function novoProduto() {
    setEditando({ produto: '', categoria: (categorias || [])[0]?.chave || '', unidade: (unidades || [])[0]?.sigla || 'un', fornecedor_id: '', codigo_barras: '', estoque_minimo: '5', e_ferramenta: false });
  }
  function editarProduto(p) {
    if (!isAdmin) { setErr('Só administradores podem editar produtos. Fale com um admin do sistema.'); return; }
    setEditando({
      codigo: p.codigo, produto: p.produto, categoria: p.categoria, unidade: p.unidade || 'un',
      fornecedor_id: p.fornecedor_id || '', codigo_barras: p.codigo_barras || '',
      estoque_minimo: String(getMinimo(p)), e_ferramenta: !!p.e_ferramenta,
    });
  }

  async function salvarProduto(ev) {
    ev.preventDefault();
    if (!editando.produto.trim() || !editando.categoria) return;
    setBusy(true);
    const payload = {
      produto: editando.produto.trim().toUpperCase(),
      categoria: editando.categoria,
      unidade: editando.unidade,
      fornecedor_id: editando.fornecedor_id || null,
      codigo_barras: editando.codigo_barras.trim() || null,
      estoque_minimo: editando.estoque_minimo === '' ? 5 : Number(editando.estoque_minimo),
      e_ferramenta: editando.e_ferramenta,
    };
    let error;
    if (editando.codigo) {
      ({ error } = await sb.from('products').update(payload).eq('codigo', editando.codigo));
    } else {
      const proximoCodigo = Math.max(0, ...(produtos || []).map((p) => p.codigo)) + 1;
      const { data: userData } = await sb.auth.getUser();
      payload.codigo = proximoCodigo;
      payload.criado_por = userData?.user?.email || '';
      ({ error } = await sb.from('products').insert([payload]));
    }
    setBusy(false);
    if (error) { setErr('Não foi possível salvar o produto.'); return; }
    await loadProdutos();
    setMsg(editando.codigo ? 'Produto atualizado.' : 'Produto cadastrado.');
    setTimeout(() => setMsg(''), 3000);
    setEditando(null);
  }

  if (editando) {
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setEditando(null)}>← Estoque</button><h1 style=${S.h1}>${editando.codigo ? 'Editar produto' : 'Novo produto'}</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${salvarProduto}>
          <label style=${S.label}>Nome do produto</label>
          <input style=${{ ...S.input, textTransform: 'uppercase' }} value=${editando.produto} onInput=${(e) => setEditando({ ...editando, produto: e.target.value })} required autofocus />
          <div style=${S.row2}>
            <div><label style=${S.label}>Categoria</label>
              <select style=${S.input} value=${editando.categoria} onChange=${(e) => setEditando({ ...editando, categoria: e.target.value })} required>
                ${(categorias || []).map((c) => html`<option value=${c.chave}>${c.nome}</option>`)}
              </select>
            </div>
            <div><label style=${S.label}>Unidade</label>
              <select style=${S.input} value=${editando.unidade} onChange=${(e) => setEditando({ ...editando, unidade: e.target.value })}>
                ${(unidades || []).map((u) => html`<option value=${u.sigla}>${u.nome} (${u.sigla})</option>`)}
              </select>
            </div>
          </div>
          <div style=${S.row2}>
            <div><label style=${S.label}>Fornecedor</label>
              <select style=${S.input} value=${editando.fornecedor_id} onChange=${(e) => setEditando({ ...editando, fornecedor_id: e.target.value })}>
                <option value="">Sem fornecedor</option>
                ${(fornecedores || []).map((f) => html`<option value=${f.id}>${f.nome}</option>`)}
              </select>
            </div>
            <div><label style=${S.label}>Estoque mínimo</label>
              <input type="number" min="0" step="1" style=${S.input} value=${editando.estoque_minimo} onInput=${(e) => setEditando({ ...editando, estoque_minimo: e.target.value })} />
            </div>
          </div>
          <label style=${S.label}>Código de barras</label>
          <input style=${S.input} value=${editando.codigo_barras} onInput=${(e) => setEditando({ ...editando, codigo_barras: e.target.value })} placeholder="opcional" />
          <label style=${{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 12.5, color: 'var(--ink-soft)', cursor: 'pointer', marginTop: 14 }}>
            <input type="checkbox" checked=${editando.e_ferramenta} onChange=${(e) => setEditando({ ...editando, e_ferramenta: e.target.checked })} style=${{ marginTop: 2 }} />
            <span>É ferramenta/equipamento (não se consome)?</span>
          </label>
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setEditando(null)}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>${editando.codigo ? 'Salvar alterações' : 'Cadastrar'}</button>
          </div>
        </form>
      </div>
    `;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Estoque</h1>${isAdmin && html`<button style=${S.btnPrimary} onClick=${novoProduto}>+ Novo produto</button>`}</div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}

      <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 12, marginBottom: 18, maxWidth: 640 }}>
        <div style=${{ background: '#fff', border: '1px solid var(--border)', borderRadius: 10, padding: '14px 16px' }}>
          <div style=${{ fontSize: 11.5, color: 'var(--ink-soft)', fontWeight: 500 }}>Produtos cadastrados</div>
          <div style=${{ fontSize: 22, fontWeight: 700, marginTop: 4 }}>${stats.total}</div>
        </div>
        <div style=${{ background: '#fff', border: '1px solid var(--border)', borderRadius: 10, padding: '14px 16px', cursor: 'pointer' }} onClick=${() => setSoBaixo(true)}>
          <div style=${{ fontSize: 11.5, color: 'var(--ink-soft)', fontWeight: 500 }}>Estoque baixo</div>
          <div style=${{ fontSize: 22, fontWeight: 700, marginTop: 4, color: stats.baixo > 0 ? 'var(--warning)' : 'var(--ink)' }}>${stats.baixo}</div>
        </div>
        <div style=${{ background: '#fff', border: '1px solid var(--border)', borderRadius: 10, padding: '14px 16px' }}>
          <div style=${{ fontSize: 11.5, color: 'var(--ink-soft)', fontWeight: 500 }}>Valor total em estoque</div>
          <div style=${{ fontSize: 20, fontWeight: 700, marginTop: 4, color: 'var(--accent)' }}>${fmtBRL(stats.valorTotal)}</div>
        </div>
      </div>

      <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginBottom: 12 }}>
        <select style=${{ ...S.input, width: 'auto' }} value=${filtroCategoria} onChange=${(e) => setFiltroCategoria(e.target.value)}>
          <option value="todos">Todas as categorias</option>
          ${(categorias || []).map((c) => html`<option value=${c.chave}>${c.nome}</option>`)}
        </select>
        <input style=${{ ...S.input, width: 220 }} placeholder="Buscar produto…" value=${busca} onInput=${(e) => setBusca(e.target.value)} />
        <label style=${{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5, color: 'var(--ink-soft)', cursor: 'pointer' }}>
          <input type="checkbox" checked=${soBaixo} onChange=${(e) => setSoBaixo(e.target.checked)} /> Só estoque baixo
        </label>
      </div>

      <div style=${S.panel}>
        <table style=${S.table}>
          <thead><tr>
            <th style=${S.th}>Código</th><th style=${S.th}>Produto</th><th style=${S.th}>Categoria</th>
            <th style=${S.th}>Fornecedor</th><th style=${{ ...S.th, textAlign: 'right' }}>Saldo</th>
            <th style=${{ ...S.th, textAlign: 'right' }}>Custo médio</th><th style=${S.th}>Status</th>
          </tr></thead>
          <tbody>
            ${listaFiltrada.map((p) => {
              const low = isLow(p);
              return html`
                <tr style=${S.tr} onClick=${() => editarProduto(p)}>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>#${String(p.codigo).padStart(3, '0')}</td>
                  <td style=${{ ...S.td, fontWeight: 500 }}>
                    ${p.produto}
                    ${p.e_ferramenta && html`<span style=${{ marginLeft: 6, fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 999, background: '#EEF2FF', color: '#4338CA' }}>FERRAMENTA</span>`}
                  </td>
                  <td style=${S.td}><span style=${{ fontSize: 11.5, color: 'var(--ink-soft)', background: 'var(--bg)', padding: '3px 8px', borderRadius: 5, fontWeight: 500 }}>${nomeCategoria(p.categoria)}</span></td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${p.fornecedor_nome || '—'}</td>
                  <td style=${{ ...S.td, textAlign: 'right', fontWeight: 600, color: low ? 'var(--danger)' : 'var(--ink)' }}>${Number(p.saldo) || 0} ${p.unidade || ''}</td>
                  <td style=${{ ...S.td, textAlign: 'right', color: 'var(--ink-soft)' }}>${p.custo_medio ? fmtBRL(p.custo_medio) : '—'}</td>
                  <td style=${S.td}>${low ? html`<${Badge} label="Estoque baixo" fg="#B45309" bg="#FFFBEB" />` : html`<${Badge} label="Normal" fg="#15803D" bg="#F0FDF4" />`}</td>
                </tr>
              `;
            })}
          </tbody>
        </table>
        ${produtos === null && html`<div style=${S.empty}>Carregando…</div>`}
        ${produtos && listaFiltrada.length === 0 && html`<div style=${S.empty}>Nenhum produto encontrado com esses filtros.</div>`}
      </div>
    </div>
  `;
}

// =====================================================================
// TELA: CADASTROS (fornecedores, categorias, unidades, áreas)
// =====================================================================
function slugify(s) {
  return normalize(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

const CADASTRO_TABS = [
  ['fornecedores', 'Fornecedores'],
  ['categorias', 'Categorias'],
  ['unidades', 'Unidades'],
  ['areas', 'Áreas'],
];

function CadastrosScreen() {
  const [sub, setSub] = useState('fornecedores');
  const [fornecedores, setFornecedores] = useState(null);
  const [categorias, setCategorias] = useState(null);
  const [unidades, setUnidades] = useState(null);
  const [areas, setAreas] = useState(null);
  const [editando, setEditando] = useState(null); // { tipo, ...campos }
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');

  async function loadFornecedores() { const { data } = await sb.from('fornecedores').select('*').order('nome'); setFornecedores(data || []); }
  async function loadCategorias() { const { data } = await sb.from('categorias').select('*').order('nome'); setCategorias(data || []); }
  async function loadUnidades() { const { data } = await sb.from('unidades').select('*').order('nome'); setUnidades(data || []); }
  async function loadAreas() { const { data } = await sb.from('areas').select('*').order('nome'); setAreas(data || []); }
  useEffect(() => { loadFornecedores(); loadCategorias(); loadUnidades(); loadAreas(); }, []);

  function notify(m) { setMsg(m); setTimeout(() => setMsg(''), 3000); }

  // ---------- fornecedores ----------
  function novoFornecedor() { setEditando({ tipo: 'fornecedores', nome: '', contato: '', telefone: '', email: '' }); }
  function editarFornecedor(f) { setEditando({ tipo: 'fornecedores', id: f.id, nome: f.nome, contato: f.contato || '', telefone: f.telefone || '', email: f.email || '' }); }
  async function salvarFornecedor() {
    const payload = { nome: editando.nome.trim().toUpperCase(), contato: editando.contato.trim(), telefone: editando.telefone.trim(), email: editando.email.trim() };
    if (editando.id) return sb.from('fornecedores').update(payload).eq('id', editando.id);
    return sb.from('fornecedores').insert([payload]);
  }
  async function excluirFornecedor(f) {
    const { data } = await sb.from('products').select('codigo').eq('fornecedor_id', f.id).limit(1);
    if (data && data.length > 0) { setErr(`Não é possível excluir: existem produtos usando o fornecedor "${f.nome}".`); return; }
    if (!window.confirm(`Excluir o fornecedor "${f.nome}"?`)) return;
    const { error } = await sb.from('fornecedores').delete().eq('id', f.id);
    if (error) { setErr('Não foi possível excluir.'); return; }
    await loadFornecedores(); notify('Fornecedor excluído.');
  }

  // ---------- categorias ----------
  function novaCategoria() { setEditando({ tipo: 'categorias', nome: '' }); }
  function editarCategoria(c) { setEditando({ tipo: 'categorias', id: c.id, nome: c.nome, chave: c.chave }); }
  async function salvarCategoria() {
    const nome = editando.nome.trim().toUpperCase();
    if (editando.id) return sb.from('categorias').update({ nome }).eq('id', editando.id);
    const { data: userData } = await sb.auth.getUser();
    return sb.from('categorias').insert([{ chave: slugify(editando.nome), nome, criado_por: userData?.user?.email || '' }]);
  }
  async function excluirCategoria(c) {
    const { data } = await sb.from('products').select('codigo').eq('categoria', c.chave).limit(1);
    if (data && data.length > 0) { setErr(`Não é possível excluir: existem produtos usando a categoria "${c.nome}".`); return; }
    if (!window.confirm(`Excluir a categoria "${c.nome}"?`)) return;
    const { error } = await sb.from('categorias').delete().eq('id', c.id);
    if (error) { setErr('Não foi possível excluir.'); return; }
    await loadCategorias(); notify('Categoria excluída.');
  }

  // ---------- unidades ----------
  function novaUnidade() { setEditando({ tipo: 'unidades', sigla: '', nome: '' }); }
  function editarUnidade(u) { setEditando({ tipo: 'unidades', id: u.id, sigla: u.sigla, nome: u.nome }); }
  async function salvarUnidade() {
    const nome = editando.nome.trim().toUpperCase();
    if (editando.id) return sb.from('unidades').update({ nome }).eq('id', editando.id);
    const { data: userData } = await sb.auth.getUser();
    return sb.from('unidades').insert([{ sigla: editando.sigla.trim().toUpperCase(), nome, criado_por: userData?.user?.email || '' }]);
  }
  async function excluirUnidade(u) {
    const { data } = await sb.from('products').select('codigo').eq('unidade', u.sigla).limit(1);
    if (data && data.length > 0) { setErr(`Não é possível excluir: existem produtos usando a unidade "${u.sigla}".`); return; }
    if (!window.confirm(`Excluir a unidade "${u.sigla}"?`)) return;
    const { error } = await sb.from('unidades').delete().eq('id', u.id);
    if (error) { setErr('Não foi possível excluir.'); return; }
    await loadUnidades(); notify('Unidade excluída.');
  }

  // ---------- áreas ----------
  function novaArea() { setEditando({ tipo: 'areas', nome: '' }); }
  function editarArea(a) { setEditando({ tipo: 'areas', id: a.id, nome: a.nome, chave: a.chave }); }
  async function salvarArea() {
    const nome = editando.nome.trim().toUpperCase();
    if (editando.id) return sb.from('areas').update({ nome }).eq('id', editando.id);
    const { data: userData } = await sb.auth.getUser();
    return sb.from('areas').insert([{ chave: slugify(editando.nome), nome, criado_por: userData?.user?.email || '' }]);
  }
  async function excluirArea(a) {
    const { data } = await sb.from('movements').select('id').eq('area_finalidade', a.nome).limit(1);
    if (data && data.length > 0) { setErr(`Não é possível excluir: já existem saídas lançadas com a área "${a.nome}".`); return; }
    if (!window.confirm(`Excluir a área "${a.nome}"?`)) return;
    const { error } = await sb.from('areas').delete().eq('id', a.id);
    if (error) { setErr('Não foi possível excluir.'); return; }
    await loadAreas(); notify('Área excluída.');
  }

  async function submit(ev) {
    ev.preventDefault();
    if (!editando.nome.trim()) return;
    if (editando.tipo === 'unidades' && !editando.id && !editando.sigla.trim()) return;
    setBusy(true);
    let result;
    if (editando.tipo === 'fornecedores') result = await salvarFornecedor();
    else if (editando.tipo === 'categorias') result = await salvarCategoria();
    else if (editando.tipo === 'unidades') result = await salvarUnidade();
    else result = await salvarArea();
    setBusy(false);
    if (result?.error) { setErr('Não foi possível salvar.'); return; }
    if (editando.tipo === 'fornecedores') await loadFornecedores();
    else if (editando.tipo === 'categorias') await loadCategorias();
    else if (editando.tipo === 'unidades') await loadUnidades();
    else await loadAreas();
    notify(editando.id ? 'Atualizado.' : 'Cadastrado.');
    setEditando(null);
  }

  if (editando) {
    const titulos = { fornecedores: 'fornecedor', categorias: 'categoria', unidades: 'unidade', areas: 'área' };
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setEditando(null)}>← Cadastros</button><h1 style=${S.h1}>${editando.id ? 'Editar' : 'Novo(a)'} ${titulos[editando.tipo]}</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${submit}>
          ${editando.tipo === 'unidades' && html`
            <label style=${S.label}>Sigla</label>
            <input style=${{ ...S.input, textTransform: 'uppercase' }} value=${editando.sigla} onInput=${(e) => setEditando({ ...editando, sigla: e.target.value })} placeholder="ex: M" maxlength="6" required disabled=${!!editando.id} autofocus />
          `}
          <label style=${S.label}>Nome</label>
          <input style=${{ ...S.input, textTransform: 'uppercase' }} value=${editando.nome} onInput=${(e) => setEditando({ ...editando, nome: e.target.value })} required autofocus=${editando.tipo !== 'unidades'} />
          ${editando.tipo === 'fornecedores' && html`
            <label style=${S.label}>Pessoa de contato</label>
            <input style=${S.input} value=${editando.contato} onInput=${(e) => setEditando({ ...editando, contato: e.target.value })} placeholder="opcional" />
            <div style=${S.row2}>
              <div><label style=${S.label}>Telefone</label><input style=${S.input} value=${editando.telefone} onInput=${(e) => setEditando({ ...editando, telefone: e.target.value })} placeholder="opcional" /></div>
              <div><label style=${S.label}>E-mail</label><input type="email" style=${S.input} value=${editando.email} onInput=${(e) => setEditando({ ...editando, email: e.target.value })} placeholder="opcional" /></div>
            </div>
          `}
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setEditando(null)}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>${editando.id ? 'Salvar alterações' : 'Cadastrar'}</button>
          </div>
        </form>
      </div>
    `;
  }

  return html`
    <div style=${S.topbar}>
      <h1 style=${S.h1}>Cadastros</h1>
      <button style=${S.btnPrimary} onClick=${() => (sub === 'fornecedores' ? novoFornecedor() : sub === 'categorias' ? novaCategoria() : sub === 'unidades' ? novaUnidade() : novaArea())}>+ Novo(a) ${CADASTRO_TABS.find((t) => t[0] === sub)[1].replace(/s$/, '')}</button>
    </div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}

      <div style=${{ display: 'flex', gap: 4, background: 'var(--bg)', padding: 3, borderRadius: 8, marginBottom: 16, maxWidth: 420 }}>
        ${CADASTRO_TABS.map(([v, l]) => html`
          <button type="button" onClick=${() => setSub(v)} style=${{ flex: 1, border: 'none', background: sub === v ? '#fff' : 'transparent', boxShadow: sub === v ? '0 1px 2px rgba(0,0,0,0.06)' : 'none', padding: '7px 0', fontSize: 12.5, fontWeight: 600, color: sub === v ? 'var(--ink)' : 'var(--ink-soft)', cursor: 'pointer', borderRadius: 6 }}>${l}</button>
        `)}
      </div>

      ${sub === 'fornecedores' && html`
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Nome</th><th style=${S.th}>Contato</th><th style=${S.th}>Telefone</th><th style=${S.th}>E-mail</th><th style=${{ ...S.th, textAlign: 'right' }}>Ações</th></tr></thead>
            <tbody>
              ${fornecedores === null ? null : fornecedores.map((f) => html`
                <tr style=${{ ...S.tr, cursor: 'default' }}>
                  <td style=${{ ...S.td, fontWeight: 500, cursor: 'pointer' }} onClick=${() => editarFornecedor(f)}>${f.nome}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${f.contato || '—'}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${f.telefone || '—'}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${f.email || '—'}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}><button style=${S.linkBtn} onClick=${() => editarFornecedor(f)}>Editar</button><button style=${{ ...S.linkBtn, color: 'var(--danger)', marginLeft: 10 }} onClick=${() => excluirFornecedor(f)}>Excluir</button></td>
                </tr>
              `)}
            </tbody>
          </table>
          ${fornecedores === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${fornecedores && fornecedores.length === 0 && html`<div style=${S.empty}>Nenhum fornecedor cadastrado ainda.</div>`}
        </div>
      `}

      ${sub === 'categorias' && html`
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Nome</th><th style=${S.th}>Chave</th><th style=${{ ...S.th, textAlign: 'right' }}>Ações</th></tr></thead>
            <tbody>
              ${categorias === null ? null : categorias.map((c) => html`
                <tr style=${{ ...S.tr, cursor: 'default' }}>
                  <td style=${{ ...S.td, fontWeight: 500, cursor: 'pointer' }} onClick=${() => editarCategoria(c)}>${c.nome}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)', fontFamily: 'monospace', fontSize: 12 }}>${c.chave}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}><button style=${S.linkBtn} onClick=${() => editarCategoria(c)}>Editar</button><button style=${{ ...S.linkBtn, color: 'var(--danger)', marginLeft: 10 }} onClick=${() => excluirCategoria(c)}>Excluir</button></td>
                </tr>
              `)}
            </tbody>
          </table>
          ${categorias === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${categorias && categorias.length === 0 && html`<div style=${S.empty}>Nenhuma categoria cadastrada ainda.</div>`}
        </div>
      `}

      ${sub === 'unidades' && html`
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Sigla</th><th style=${S.th}>Nome</th><th style=${{ ...S.th, textAlign: 'right' }}>Ações</th></tr></thead>
            <tbody>
              ${unidades === null ? null : unidades.map((u) => html`
                <tr style=${{ ...S.tr, cursor: 'default' }}>
                  <td style=${{ ...S.td, fontWeight: 700, fontFamily: 'monospace', cursor: 'pointer' }} onClick=${() => editarUnidade(u)}>${u.sigla}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${u.nome}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}><button style=${S.linkBtn} onClick=${() => editarUnidade(u)}>Editar</button><button style=${{ ...S.linkBtn, color: 'var(--danger)', marginLeft: 10 }} onClick=${() => excluirUnidade(u)}>Excluir</button></td>
                </tr>
              `)}
            </tbody>
          </table>
          ${unidades === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${unidades && unidades.length === 0 && html`<div style=${S.empty}>Nenhuma unidade cadastrada ainda.</div>`}
        </div>
      `}

      ${sub === 'areas' && html`
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Nome</th><th style=${{ ...S.th, textAlign: 'right' }}>Ações</th></tr></thead>
            <tbody>
              ${areas === null ? null : areas.map((a) => html`
                <tr style=${{ ...S.tr, cursor: 'default' }}>
                  <td style=${{ ...S.td, fontWeight: 500, cursor: 'pointer' }} onClick=${() => editarArea(a)}>${a.nome}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}><button style=${S.linkBtn} onClick=${() => editarArea(a)}>Editar</button><button style=${{ ...S.linkBtn, color: 'var(--danger)', marginLeft: 10 }} onClick=${() => excluirArea(a)}>Excluir</button></td>
                </tr>
              `)}
            </tbody>
          </table>
          ${areas === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${areas && areas.length === 0 && html`<div style=${S.empty}>Nenhuma área cadastrada ainda.</div>`}
        </div>
      `}
    </div>
  `;
}

// =====================================================================
// TELA: COMPRAS (requisições)
// =====================================================================
function ComprasScreen() {
  const [view, setView] = useState('lista'); // lista | form | detalhe
  const [lista, setLista] = useState(null);
  const [produtos, setProdutos] = useState(null);
  const [selected, setSelected] = useState(null);
  const [itensSelected, setItensSelected] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const [setor, setSetor] = useState('');
  const [localEntrega, setLocalEntrega] = useState('');
  const [empresa, setEmpresa] = useState('');
  const [observacao, setObservacao] = useState('');
  const [itens, setItens] = useState([]);
  const [addCodigo, setAddCodigo] = useState('');
  const [addQtd, setAddQtd] = useState('1');
  const [addMarca, setAddMarca] = useState('');

  async function loadLista() {
    const { data, error } = await sb.from('requisicoes').select('*, requisicao_itens(count)').order('numero', { ascending: false });
    if (error) { setErr('Não foi possível carregar as requisições.'); return; }
    setLista(data || []);
  }
  async function loadProdutos() {
    const { data } = await sb.from('product_balances').select('*');
    setProdutos(data || []);
  }
  useEffect(() => { loadLista(); loadProdutos(); }, []);

  function novaRequisicao() {
    setSetor(''); setLocalEntrega(''); setEmpresa(''); setObservacao(''); setItens([]);
    setAddCodigo(''); setAddQtd('1'); setAddMarca('');
    setView('form');
  }

  function addItem() {
    if (!addCodigo || !addQtd || Number(addQtd) <= 0) return;
    const p = (produtos || []).find((x) => x.codigo === Number(addCodigo));
    if (!p) return;
    if (itens.some((i) => i.codigo === p.codigo)) { setErr('Esse produto já está na lista.'); return; }
    setItens([...itens, { codigo: p.codigo, produto: p.produto, unidade: p.unidade || 'un', quantidade: Number(addQtd), marca_sugerida: addMarca.trim().toUpperCase() }]);
    setAddCodigo(''); setAddQtd('1'); setAddMarca('');
  }
  function removeItem(codigo) { setItens(itens.filter((i) => i.codigo !== codigo)); }

  async function salvarRequisicao(ev) {
    ev.preventDefault();
    if (itens.length === 0) { setErr('Adicione ao menos um item.'); return; }
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const { data: req, error } = await sb.from('requisicoes').insert([{
      empresa: empresa.trim(), local_entrega: localEntrega.trim(), setor_requisitante: setor.trim(),
      observacao: observacao.trim(), criado_por: userData?.user?.email || '',
    }]).select().single();
    if (error || !req) { setBusy(false); setErr('Não foi possível criar a requisição.'); return; }
    const linhas = itens.map((i) => ({ requisicao_id: req.id, codigo: i.codigo, produto: i.produto, unidade: i.unidade, quantidade: i.quantidade, marca_sugerida: i.marca_sugerida }));
    const { error: itErr } = await sb.from('requisicao_itens').insert(linhas);
    setBusy(false);
    if (itErr) { setErr('Requisição criada, mas houve erro ao salvar os itens.'); return; }
    await loadLista();
    abrirDetalhe(req);
  }

  async function abrirDetalhe(req) {
    setSelected(req); setItensSelected(null); setView('detalhe');
    const { data } = await sb.from('requisicao_itens').select('*').eq('requisicao_id', req.id).order('created_at');
    setItensSelected(data || []);
  }

  async function atender() {
    if (!itensSelected || itensSelected.length === 0) return;
    const faltando = [];
    for (const it of itensSelected) {
      const p = (produtos || []).find((x) => x.codigo === it.codigo);
      if (!p || Number(p.saldo) < Number(it.quantidade)) faltando.push(`${it.produto} (precisa ${it.quantidade}, tem ${p ? p.saldo : 0})`);
    }
    if (faltando.length > 0) { setErr(`Não dá pra atender agora — falta estoque de: ${faltando.join(', ')}.`); return; }
    if (!window.confirm(`Atender a requisição #${selected.numero}? Isso vai dar saída de ${itensSelected.length} item(ns) no estoque.`)) return;
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const criado_por = userData?.user?.email || '';
    const areaFinalidade = (selected.setor_requisitante || selected.empresa || 'REQUISIÇÃO').toUpperCase();
    const movs = itensSelected.map((it) => {
      const p = (produtos || []).find((x) => x.codigo === it.codigo);
      return {
        data: todayISO(), tipo: 'saida', codigo: it.codigo, produto: it.produto, quantidade: it.quantidade,
        valor: 0, valor_total: 0, marca: '', area_finalidade: areaFinalidade,
        solicitante: (selected.setor_requisitante || '').toUpperCase(), nota_fiscal: `Requisição #${selected.numero}`,
        categoria: p ? p.categoria : '', requisicao_id: selected.id, criado_por,
      };
    });
    const { error } = await sb.from('movements').insert(movs);
    if (error) { setBusy(false); setErr('Não foi possível registrar as saídas dessa requisição.'); return; }
    const { error: e2 } = await sb.from('requisicoes').update({ status: 'fechada' }).eq('id', selected.id);
    setBusy(false);
    if (e2) { setErr('As saídas foram lançadas, mas não deu pra marcar a requisição como fechada.'); return; }
    await Promise.all([loadLista(), loadProdutos()]);
    setSelected({ ...selected, status: 'fechada' });
  }
  async function reabrir() {
    if (!window.confirm(`Reabrir a requisição #${selected.numero}? Isso não desfaz as saídas de estoque já lançadas.`)) return;
    const { error } = await sb.from('requisicoes').update({ status: 'aberta' }).eq('id', selected.id);
    if (error) { setErr('Não foi possível reabrir.'); return; }
    await loadLista();
    setSelected({ ...selected, status: 'aberta' });
  }

  if (view === 'form') {
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setView('lista')}>← Compras</button><h1 style=${S.h1}>Nova requisição</h1></div>
      <div style=${S.content}>
        ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
        <form style=${{ ...S.formCard, maxWidth: 640 }} onSubmit=${salvarRequisicao}>
          <div style=${S.row2}>
            <div><label style=${S.label}>Setor requisitante</label><input style=${S.input} value=${setor} onInput=${(e) => setSetor(e.target.value)} placeholder="ex: Almoxarifado" /></div>
            <div><label style=${S.label}>Local de entrega</label><input style=${S.input} value=${localEntrega} onInput=${(e) => setLocalEntrega(e.target.value)} placeholder="opcional" /></div>
          </div>
          <label style=${S.label}>Empresa (aparece no orçamento impresso)</label>
          <input style=${S.input} value=${empresa} onInput=${(e) => setEmpresa(e.target.value)} placeholder="opcional" />
          <label style=${S.label}>Observação</label>
          <textarea style=${{ ...S.input, minHeight: 50, resize: 'vertical' }} value=${observacao} onInput=${(e) => setObservacao(e.target.value)} placeholder="opcional"></textarea>

          <div style=${{ fontWeight: 700, fontSize: 13, margin: '18px 0 8px' }}>Itens</div>
          <div style=${{ display: 'flex', gap: 6, marginBottom: 10 }}>
            <div style=${{ flex: 1 }}><${ProdutoPicker} produtos=${produtos} value=${addCodigo} onChange=${setAddCodigo} /></div>
            <input type="number" min="0.01" step="0.01" placeholder="qtd." value=${addQtd} onInput=${(e) => setAddQtd(e.target.value)} style=${{ ...S.input, width: 70 }} />
            <input placeholder="marca (opcional)" value=${addMarca} onInput=${(e) => setAddMarca(e.target.value)} style=${{ ...S.input, width: 130 }} />
            <button type="button" style=${S.btnGhost} onClick=${addItem}>+</button>
          </div>
          ${itens.length > 0 ? html`
            <div style=${{ border: '1px solid var(--border)', borderRadius: 8, overflow: 'hidden' }}>
              ${itens.map((i) => html`
                <div key=${i.codigo} style=${{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', borderBottom: '1px solid var(--bg)' }}>
                  <div style=${{ flex: 1, fontSize: 13 }}>${i.produto} ${i.marca_sugerida ? `· ${i.marca_sugerida}` : ''}</div>
                  <div style=${{ fontSize: 12.5, color: 'var(--ink-soft)' }}>${i.quantidade} ${i.unidade}</div>
                  <button type="button" style=${{ ...S.linkBtn, color: 'var(--danger)' }} onClick=${() => removeItem(i.codigo)}>Remover</button>
                </div>
              `)}
            </div>
          ` : html`<div style=${{ ...S.empty, border: '1px dashed var(--border)', borderRadius: 8 }}>Nenhum item adicionado ainda.</div>`}

          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setView('lista')}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>Salvar requisição</button>
          </div>
        </form>
      </div>
    `;
  }

  if (view === 'detalhe' && selected) {
    return html`
      <div style=${S.topbar}>
        <div><button style=${{ ...S.linkBtn, marginBottom: 6, display: 'block' }} onClick=${() => setView('lista')}>← Compras</button><h1 style=${S.h1}>Requisição #${selected.numero}</h1></div>
        ${selected.status === 'aberta' ? html`<${Badge} label="Aberta" fg="#B45309" bg="#FFFBEB" />` : html`<${Badge} label="Fechada" fg="#15803D" bg="#F0FDF4" />`}
      </div>
      <div style=${S.content}>
        ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
        <div style=${{ fontSize: 12.5, color: 'var(--ink-soft)', marginBottom: 14 }}>
          ${selected.setor_requisitante ? `Setor: ${selected.setor_requisitante} · ` : ''}${fmtDate(selected.data)}
          ${selected.observacao ? html`<div style=${{ marginTop: 4 }}>${selected.observacao}</div>` : ''}
        </div>
        <div style=${{ display: 'flex', gap: 8, marginBottom: 16 }}>
          ${selected.status === 'aberta'
            ? html`<button style=${S.btnPrimary} onClick=${atender} disabled=${busy}>Atender requisição</button>`
            : html`<button style=${S.btnGhost} onClick=${reabrir}>Reabrir requisição</button>`}
        </div>
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Produto</th><th style=${S.th}>Marca sugerida</th><th style=${{ ...S.th, textAlign: 'right' }}>Qtd.</th></tr></thead>
            <tbody>
              ${itensSelected === null ? null : itensSelected.map((i) => html`
                <tr style=${{ ...S.tr, cursor: 'default' }}>
                  <td style=${{ ...S.td, fontWeight: 500 }}>${i.produto}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${i.marca_sugerida || '—'}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}>${i.quantidade} ${i.unidade}</td>
                </tr>
              `)}
            </tbody>
          </table>
          ${itensSelected === null && html`<div style=${S.empty}>Carregando…</div>`}
        </div>
      </div>
    `;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Compras</h1><button style=${S.btnPrimary} onClick=${novaRequisicao}>+ Nova requisição</button></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      <div style=${S.panel}>
        <table style=${S.table}>
          <thead><tr><th style=${S.th}>Nº</th><th style=${S.th}>Data</th><th style=${S.th}>Setor</th><th style=${{ ...S.th, textAlign: 'right' }}>Itens</th><th style=${S.th}>Status</th></tr></thead>
          <tbody>
            ${lista === null ? null : lista.map((r) => html`
              <tr style=${S.tr} onClick=${() => abrirDetalhe(r)}>
                <td style=${{ ...S.td, fontWeight: 700 }}>#${r.numero}</td>
                <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${fmtDate(r.data)}</td>
                <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${r.setor_requisitante || '—'}</td>
                <td style=${{ ...S.td, textAlign: 'right' }}>${r.requisicao_itens?.[0]?.count ?? 0}</td>
                <td style=${S.td}>${r.status === 'aberta' ? html`<${Badge} label="Aberta" fg="#B45309" bg="#FFFBEB" />` : html`<${Badge} label="Fechada" fg="#15803D" bg="#F0FDF4" />`}</td>
              </tr>
            `)}
          </tbody>
        </table>
        ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
        ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhuma requisição criada ainda.</div>`}
      </div>
    </div>
  `;
}

// =====================================================================
// TELA: INVENTÁRIO (contagem física)
// =====================================================================
function InventarioScreen() {
  const [view, setView] = useState('lista'); // lista | novo | detalhe
  const [lista, setLista] = useState(null);
  const [produtos, setProdutos] = useState(null);
  const [categorias, setCategorias] = useState(null);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);

  // criação
  const [filtroCategoria, setFiltroCategoria] = useState('todos');
  const [busca, setBusca] = useState('');
  const [soBaixo, setSoBaixo] = useState(false);
  const [selecionados, setSelecionados] = useState({});
  const [observacao, setObservacao] = useState('');

  // detalhe
  const [inventario, setInventario] = useState(null);
  const [itens, setItens] = useState(null);
  const [contagens, setContagens] = useState({});

  async function loadLista() {
    const { data, error } = await sb.from('inventarios').select('*, inventario_itens(count)').order('numero', { ascending: false });
    if (error) { setErr('Não foi possível carregar os inventários.'); return; }
    setLista(data || []);
  }
  async function loadApoio() {
    const [{ data: p }, { data: c }] = await Promise.all([
      sb.from('product_balances').select('*'),
      sb.from('categorias').select('*').order('nome'),
    ]);
    setProdutos(p || []); setCategorias(c || []);
  }
  useEffect(() => { loadLista(); loadApoio(); }, []);

  function nomeCategoria(chave) { const c = (categorias || []).find((x) => x.chave === chave); return c ? c.nome : (chave || '—'); }

  function notify(m) { setMsg(m); setTimeout(() => setMsg(''), 3000); }

  const produtosFiltrados = useMemo(() => {
    const q = normalize(busca);
    return (produtos || [])
      .filter((p) => filtroCategoria === 'todos' || p.categoria === filtroCategoria)
      .filter((p) => !soBaixo || isLow(p))
      .filter((p) => !q || normalize(p.produto).includes(q) || String(p.codigo).includes(busca))
      .sort((a, b) => a.produto.localeCompare(b.produto));
  }, [produtos, filtroCategoria, busca, soBaixo]);

  function iniciarNovo() {
    setFiltroCategoria('todos'); setBusca(''); setSoBaixo(false); setObservacao(''); setSelecionados({});
    setView('novo');
  }

  async function criarInventario(ev) {
    ev.preventDefault();
    const itensSelecionados = produtosFiltrados.filter((p) => selecionados[p.codigo] !== false);
    if (itensSelecionados.length === 0) { setErr('Selecione ao menos um item.'); return; }
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const { data: inv, error } = await sb.from('inventarios').insert([{
      categoria_filtro: filtroCategoria === 'todos' ? null : filtroCategoria,
      observacao: observacao.trim(), criado_por: userData?.user?.email || '',
    }]).select().single();
    if (error || !inv) { setBusy(false); setErr('Não foi possível criar o inventário.'); return; }
    const linhas = itensSelecionados.map((p) => ({ inventario_id: inv.id, codigo: p.codigo, produto: p.produto, categoria: p.categoria, unidade: p.unidade, saldo_sistema: Number(p.saldo) || 0 }));
    const { error: itErr } = await sb.from('inventario_itens').insert(linhas);
    setBusy(false);
    if (itErr) { setErr('Inventário criado, mas houve erro ao gerar os itens.'); return; }
    await loadLista();
    notify(`Inventário #${inv.numero} iniciado com ${itensSelecionados.length} itens.`);
    abrirDetalhe(inv);
  }

  async function abrirDetalhe(inv) {
    setInventario(inv); setItens(null); setContagens({}); setView('detalhe');
    const { data } = await sb.from('inventario_itens').select('*').eq('inventario_id', inv.id).order('produto');
    setItens(data || []);
    const c = {};
    (data || []).forEach((i) => { if (i.contagem_fisica !== null) c[i.id] = String(i.contagem_fisica); });
    setContagens(c);
  }

  async function salvarProgresso() {
    if (!itens) return;
    setBusy(true);
    const alterados = itens.filter((i) => contagens[i.id] !== undefined && contagens[i.id] !== '' && Number(contagens[i.id]) !== i.contagem_fisica);
    for (const i of alterados) {
      await sb.from('inventario_itens').update({ contagem_fisica: Number(contagens[i.id]) }).eq('id', i.id);
    }
    setBusy(false);
    await abrirDetalhe(inventario);
    notify(alterados.length > 0 ? `${alterados.length} contagem(ns) salva(s).` : 'Nada novo pra salvar.');
  }

  async function concluirInventario() {
    if (!itens) return;
    const contados = itens.filter((i) => contagens[i.id] !== undefined && contagens[i.id] !== '');
    const naoContados = itens.length - contados.length;
    const diferentes = contados.filter((i) => Number(contagens[i.id]) !== i.saldo_sistema);
    const aviso = naoContados > 0
      ? `${naoContados} item(ns) ainda não foram contados e ficarão de fora. Concluir mesmo assim? Isso vai gerar ${diferentes.length} ajuste(s) de estoque e não pode ser desfeito.`
      : `Concluir inventário? Isso vai gerar ${diferentes.length} ajuste(s) de estoque e não pode ser desfeito.`;
    if (!window.confirm(aviso)) return;
    setBusy(true);
    for (const i of contados) {
      if (Number(contagens[i.id]) !== i.contagem_fisica) await sb.from('inventario_itens').update({ contagem_fisica: Number(contagens[i.id]) }).eq('id', i.id);
    }
    const { data: userData } = await sb.auth.getUser();
    const criado_por = userData?.user?.email || '';
    const movs = diferentes.map((i) => {
      const diff = Number(contagens[i.id]) - i.saldo_sistema;
      return { data: todayISO(), tipo: diff > 0 ? 'entrada' : 'saida', codigo: i.codigo, produto: i.produto, quantidade: Math.abs(diff), valor: 0, valor_total: 0, marca: '', nota_fiscal: `Ajuste inventário #${inventario.numero}`, categoria: i.categoria, criado_por };
    });
    if (movs.length > 0) await sb.from('movements').insert(movs);
    await sb.from('inventarios').update({ status: 'fechado', fechado_por: criado_por, fechado_em: new Date().toISOString() }).eq('id', inventario.id);
    setBusy(false);
    await Promise.all([loadLista(), loadApoio()]);
    notify(`Inventário #${inventario.numero} concluído — ${diferentes.length} ajuste(s) aplicado(s).`);
    abrirDetalhe({ ...inventario, status: 'fechado' });
  }

  // ---------- lista ----------
  if (view === 'lista') {
    return html`
      <div style=${S.topbar}><h1 style=${S.h1}>Inventário</h1><button style=${S.btnPrimary} onClick=${iniciarNovo}>+ Novo inventário</button></div>
      <div style=${S.content}>
        ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
        ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Nº</th><th style=${S.th}>Data</th><th style=${S.th}>Categoria</th><th style=${{ ...S.th, textAlign: 'right' }}>Itens</th><th style=${S.th}>Status</th></tr></thead>
            <tbody>
              ${lista === null ? null : lista.map((inv) => html`
                <tr style=${S.tr} onClick=${() => abrirDetalhe(inv)}>
                  <td style=${{ ...S.td, fontWeight: 700 }}>#${inv.numero}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${fmtDate(inv.data)}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${inv.categoria_filtro ? nomeCategoria(inv.categoria_filtro) : 'Todas'}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}>${inv.inventario_itens?.[0]?.count ?? 0}</td>
                  <td style=${S.td}>${inv.status === 'aberto' ? html`<${Badge} label="Aberto" fg="#B45309" bg="#FFFBEB" />` : html`<${Badge} label="Fechado" fg="#15803D" bg="#F0FDF4" />`}</td>
                </tr>
              `)}
            </tbody>
          </table>
          ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhum inventário criado ainda.</div>`}
        </div>
      </div>
    `;
  }

  // ---------- novo ----------
  if (view === 'novo') {
    const totalSelecionados = produtosFiltrados.filter((p) => selecionados[p.codigo] !== false).length;
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setView('lista')}>← Inventário</button><h1 style=${S.h1}>Novo inventário</h1></div>
      <div style=${S.content}>
        ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
        <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginBottom: 12 }}>
          <select style=${{ ...S.input, width: 'auto' }} value=${filtroCategoria} onChange=${(e) => setFiltroCategoria(e.target.value)}>
            <option value="todos">Todas as categorias</option>
            ${(categorias || []).map((c) => html`<option value=${c.chave}>${c.nome}</option>`)}
          </select>
          <input style=${{ ...S.input, width: 220 }} placeholder="Buscar produto…" value=${busca} onInput=${(e) => setBusca(e.target.value)} />
          <label style=${{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5, color: 'var(--ink-soft)', cursor: 'pointer' }}>

        </div>

  }

  // ---------- detalhe ----------
  if (view === 'detalhe' && inventario) {
    const contadosCount = (itens || []).filter((i) => contagens[i.id] !== undefined && contagens[i.id] !== '').length;
    const diferentesCount = (itens || []).filter((i) => contagens[i.id] !== undefined && contagens[i.id] !== '' && Number(contagens[i.id]) !== i.saldo_sistema).length;
    return html`
      <div style=${S.topbar}>
        <div><button style=${{ ...S.linkBtn, marginBottom: 6, display: 'block' }} onClick=${() => setView('lista')}>← Inventário</button><h1 style=${S.h1}>Inventário #${inventario.numero}</h1></div>
        ${inventario.status === 'aberto' ? html`<${Badge} label="Aberto" fg="#B45309" bg="#FFFBEB" />` : html`<${Badge} label="Fechado" fg="#15803D" bg="#F0FDF4" />`}
      </div>
      <div style=${S.content}>
        ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
        ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}

        <div style=${{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '6px 16px', background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 14px', marginBottom: 14, maxWidth: 480 }}>
          <div><div style=${{ fontSize: 10.5, color: 'var(--ink-soft)', fontWeight: 600, textTransform: 'uppercase' }}>Contados</div><div style=${{ fontSize: 16, fontWeight: 700 }}>${contadosCount} / ${(itens || []).length}</div></div>
          <div style=${{ textAlign: 'right' }}><div style=${{ fontSize: 10.5, color: 'var(--ink-soft)', fontWeight: 600, textTransform: 'uppercase' }}>Com diferença</div><div style=${{ fontSize: 16, fontWeight: 700, color: diferentesCount > 0 ? 'var(--warning)' : 'var(--ink)' }}>${diferentesCount}</div></div>
        </div>

        ${inventario.status === 'aberto' && html`
          <div style=${{ display: 'flex', gap: 10, marginBottom: 16 }}>
            <button style=${S.btnGhost} onClick=${salvarProgresso} disabled=${busy}>Salvar progresso</button>
            <button style=${S.btnPrimary} onClick=${concluirInventario} disabled=${busy}>Concluir inventário</button>

        <div style=${S.panel}>

            <tbody>
              ${itens === null ? null : itens.map((i) => {
                const v = contagens[i.id];
                const tem = v !== undefined && v !== '';
                const diff = tem ? Number(v) - i.saldo_sistema : null;
                return html`
                  <tr style=${{ ...S.tr, cursor: 'default' }}>
                    <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>#${String(i.codigo).padStart(3, '0')}</td>
                    <td style=${{ ...S.td, fontWeight: 500 }}>${i.produto}</td>
                    <td style=${{ ...S.td, textAlign: 'right', color: 'var(--ink-soft)' }}>${i.saldo_sistema} ${i.unidade || ''}</td>

                        ? html`<input type="number" min="0" step="0.01" value=${v ?? ''} onInput=${(e) => setContagens({ ...contagens, [i.id]: e.target.value })} style=${{ ...S.input, width: 90, textAlign: 'right', padding: '6px 8px' }} placeholder="—" />`
                        : (i.contagem_fisica ?? '—')}
                    </td>
                    <td style=${{ ...S.td, textAlign: 'right', fontWeight: 700, color: diff === null ? 'var(--ink-soft)' : diff === 0 ? 'var(--success)' : 'var(--danger)' }}>
                      ${diff === null ? '—' : diff > 0 ? `+${diff}` : diff}
                    </td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
          ${itens === null && html`<div style=${S.empty}>Carregando…</div>`}
        </div>
      </div>
    `;
  }

  return null;
}
