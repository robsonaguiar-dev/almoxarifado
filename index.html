<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle de Almoxarifado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    --bg: #F1F5F9; --surface: #FFFFFF; --sidebar: #111827; --ink: #111827; --ink-soft: #64748B;
    --border: #E2E8F0; --accent: #2563EB; --success: #15803D; --success-soft: #F0FDF4;
    --danger: #B91C1C; --danger-soft: #FEF2F2; --warning: #B45309; --warning-soft: #FFFBEB;
    background: var(--bg); font-family: 'Inter', -apple-system, sans-serif;
  }
  ::placeholder { color: #94A3B8; }
  button { transition: opacity .15s, transform .15s; }
  button:hover { opacity: 0.85; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  tbody tr:hover { background: #F8FAFC; }
  #boot-msg { font-family: monospace; color:#64748B; padding: 40px; text-align:center; white-space: pre-wrap; }

  .sidebar { transition: transform .25s ease; }
  .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 140; }
  .hamburger-btn { display: none; }

  @media (max-width: 1023px) {
    .sidebar {
      position: fixed !important;
      top: 0 !important; left: 0 !important; bottom: 0 !important;
      width: 220px !important;
      z-index: 150;
      transform: translateX(-100%) !important;
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
    }
    .sidebar.open { transform: translateX(0) !important; }
    .hamburger-btn { display: inline-flex !important; }
  }

  @media (max-width: 860px) { .stats-row-override { grid-template-columns: repeat(2, 1fr) !important; } }
  @media (max-width: 480px) { .stats-row-override { grid-template-columns: 1fr !important; } }
  @media (max-width: 640px) {
    .topbar-override { padding: 16px 16px 14px !important; }
    .content-override { padding: 0 16px !important; }
    .field-grid-2 { grid-template-columns: 1fr !important; }
    .modal-card-override {
      width: 100% !important; border-radius: 14px 14px 0 0 !important;
      position: fixed !important; bottom: 0 !important; left: 0 !important; margin: 0 !important; max-height: 92vh !important;
    }
    .modal-backdrop-override { align-items: flex-end !important; padding: 0 !important; }
  }

  /* Impressão / exportar PDF: mostra só a tabela atual, sem navegação nem botões */
  @media print {
    .print-hide { display: none !important; }
    body { background: #fff; }
    .content-override { padding: 0 !important; }
    table { font-size: 11px !important; }
    th, td { padding: 6px 8px !important; white-space: normal !important; }
  }
</style>
