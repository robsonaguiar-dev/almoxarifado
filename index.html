function RelatorioEstoqueParado() {
  const [dias, setDias] = useState('30');
  const [produtos, setProdutos] = useState(null);
  const [ultimaMov, setUltimaMov] = useState(null);
  const [err, setErr] = useState('');

  async function load() {
    const [{ data: p, error: e1 }, { data: u, error: e2 }] = await Promise.all([
      sb.from('product_balances').select('*'),
      sb.from('produto_ultima_movimentacao').select('*'),
    ]);
    if (e1 || e2) { setErr('Não foi possível carregar o relatório.'); return; }
    setProdutos(p || []); setUltimaMov(u || []);
  }
  useEffect(() => { load(); }, []);

  const lista = useMemo(() => {
    if (!produtos || !ultimaMov) return null;
    const hoje = new Date(todayISO() + 'T00:00:00').getTime();
    const mapa = {}; ultimaMov.forEach((u) => (mapa[u.codigo] = u.ultima_saida));
    return produtos
      .filter((p) => (Number(p.saldo) || 0) > 0)
      .map((p) => {
        const ultima = mapa[p.codigo] || null;
        const diasParado = ultima ? Math.floor((hoje - new Date(ultima + 'T00:00:00').getTime()) / 86400000) : null;
        return { ...p, ultimaSaida: ultima, diasParado };
      })
      .filter((p) => p.diasParado === null || p.diasParado >= Number(dias))
      .sort((a, b) => (b.diasParado ?? 999999) - (a.diasParado ?? 999999));
  }, [produtos, ultimaMov, dias]);

  return html`
    ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
    <div style=${{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
      <span style=${{ fontSize: 12.5, color: 'var(--ink-soft)' }}>Sem saída há pelo menos</span>
      <select style=${{ ...S.input, width: 'auto' }} value=${dias} onChange=${(e) => setDias(e.target.value)}>
        <option value="30">30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option><option value="180">180 dias</option>
      </select>
    </div>
    <div style=${S.panel}>
      <table style=${S.table}>
        <thead><tr><th style=${S.th}>Produto</th><th style=${S.th}>Categoria</th><th style=${{ ...S.th, textAlign: 'right' }}>Saldo</th><th style=${{ ...S.th, textAlign: 'right' }}>Valor parado</th><th style=${{ ...S.th, textAlign: 'right' }}>Última saída</th></tr></thead>
        <tbody>
          ${lista === null ? null : lista.map((p) => html`
            <tr style=${{ ...S.tr, cursor: 'default' }}>
              <td style=${{ ...S.td, fontWeight: 500 }}>${p.produto}</td>
              <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${p.categoria}</td>
              <td style=${{ ...S.td, textAlign: 'right' }}>${p.saldo} ${p.unidade || ''}</td>
              <td style=${{ ...S.td, textAlign: 'right', fontWeight: 600 }}>${fmtBRL((Number(p.saldo) || 0) * (Number(p.custo_medio) || 0))}</td>
              <td style=${{ ...S.td, textAlign: 'right' }}>
                ${p.ultimaSaida ? html`<div>${fmtDate(p.ultimaSaida)}</div><div style=${{ fontSize: 11, color: 'var(--warning)' }}>há ${p.diasParado} dia(s)</div>` : html`<span style=${{ color: 'var(--danger)', fontWeight: 600 }}>nunca saiu</span>`}
              </td>
            </tr>
          `)}
        </tbody>
      </table>
      ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
      ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhum produto parado com esse filtro — ótimo sinal!</div>`}
    </div>
  `;
}

function RelatorioConsumo() {
  const [agruparPor, setAgruparPor] = useState('area');
  const [de, setDe] = useState('');
  const [ate, setAte] = useState('');
  const [resultado, setResultado] = useState(null);
  const [err, setErr] = useState('');

  async function gerar() {
    setResultado(null); setErr('');
    let q = sb.from('movements').select('*').eq('tipo', 'saida');
    if (de) q = q.gte('data', de);
    if (ate) q = q.lte('data', ate);
    const { data, error } = await q;
    if (error) { setErr('Não foi possível gerar o relatório.'); return; }
    const grupos = {};
    (data || []).forEach((m) => {
      const chave = agruparPor === 'area' ? (m.area_finalidade || '(sem área informada)') : (m.solicitante || '(não informado)');
      if (!grupos[chave]) grupos[chave] = { chave, qtd: 0, valor: 0, saidas: 0 };
      grupos[chave].qtd += Number(m.quantidade) || 0;
      grupos[chave].valor += Number(m.valor_total) || 0;
      grupos[chave].saidas += 1;
    });
    setResultado(Object.values(grupos).sort((a, b) => b.valor - a.valor));
  }

  return html`
    ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
    <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginBottom: 14 }}>
      <select style=${{ ...S.input, width: 'auto' }} value=${agruparPor} onChange=${(e) => setAgruparPor(e.target.value)}>
        <option value="area">Por área/finalidade</option>
        <option value="solicitante">Por solicitante</option>
      </select>
      <input type="date" style=${{ ...S.input, width: 'auto' }} value=${de} onInput=${(e) => setDe(e.target.value)} />
      <span style=${{ fontSize: 12.5, color: 'var(--ink-soft)' }}>até</span>
      <input type="date" style=${{ ...S.input, width: 'auto' }} value=${ate} onInput=${(e) => setAte(e.target.value)} />
      <button style=${S.btnPrimary} onClick=${gerar}>Gerar</button>
    </div>
    ${resultado === null ? html`
      <div style=${{ ...S.panel, padding: '32px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, textAlign: 'center' }}>
        <div style=${{ fontSize: 28 }}>📊</div>
        <div style=${{ fontSize: 13, color: 'var(--ink-soft)' }}>Escolha o período e clique em "Gerar".</div>
      </div>
    ` : html`
      <div style=${S.panel}>
        <table style=${S.table}>
          <thead><tr><th style=${S.th}>${agruparPor === 'area' ? 'Área / Finalidade' : 'Solicitante'}</th><th style=${{ ...S.th, textAlign: 'right' }}>Nº de saídas</th><th style=${{ ...S.th, textAlign: 'right' }}>Quantidade</th><th style=${{ ...S.th, textAlign: 'right' }}>Valor total</th></tr></thead>
          <tbody>
            ${resultado.map((r) => html`
              <tr style=${{ ...S.tr, cursor: 'default' }}>
                <td style=${{ ...S.td, fontWeight: 500 }}>${r.chave}</td>
                <td style=${{ ...S.td, textAlign: 'right' }}>${r.saidas}</td>
                <td style=${{ ...S.td, textAlign: 'right' }}>${r.qtd}</td>
                <td style=${{ ...S.td, textAlign: 'right', fontWeight: 600 }}>${fmtBRL(r.valor)}</td>
              </tr>
            `)}
          </tbody>
        </table>
        ${resultado.length === 0 && html`<div style=${S.empty}>Nenhuma saída com área/solicitante informado nesse período.</div>`}
      </div>
    `}
  `;
}

function RelatorioAnaliseCompras() {
  const [categoria, setCategoria] = useState('todos');
  const [categorias, setCategorias] = useState(null);
  const [de, setDe] = useState('');
  const [ate, setAte] = useState('');
  const [resultado, setResultado] = useState(null);
  const [err, setErr] = useState('');

  useEffect(() => { sb.from('categorias').select('*').order('nome').then(({ data }) => setCategorias(data || [])); }, []);

  async function gerar() {
    setResultado(null); setErr('');
    let q = sb.from('movements').select('*').eq('tipo', 'entrada');
    if (categoria !== 'todos') q = q.eq('categoria', categoria);
    if (de) q = q.gte('data', de);
    if (ate) q = q.lte('data', ate);
    const { data, error } = await q;
    if (error) { setErr('Não foi possível gerar a análise.'); return; }
    const porProduto = {};
    (data || []).forEach((m) => {
      if (!porProduto[m.codigo]) porProduto[m.codigo] = { codigo: m.codigo, produto: m.produto, categoria: m.categoria, compras: [] };
      porProduto[m.codigo].compras.push(m);
    });
    const lista = Object.values(porProduto).map((p) => {
      const totalQtd = p.compras.reduce((s, c) => s + Number(c.quantidade), 0);
      const totalGasto = p.compras.reduce((s, c) => s + Number(c.quantidade) * Number(c.valor || 0), 0);
      return { ...p, totalQtd, totalGasto, custoMedio: totalQtd ? totalGasto / totalQtd : 0 };
    }).sort((a, b) => a.produto.localeCompare(b.produto));
    setResultado(lista);
  }

  return html`
    ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
    <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginBottom: 14 }}>
      <select style=${{ ...S.input, width: 'auto' }} value=${categoria} onChange=${(e) => setCategoria(e.target.value)}>
        <option value="todos">Todas as categorias</option>
        ${(categorias || []).map((c) => html`<option value=${c.chave}>${c.nome}</option>`)}
      </select>
      <input type="date" style=${{ ...S.input, width: 'auto' }} value=${de} onInput=${(e) => setDe(e.target.value)} />
      <span style=${{ fontSize: 12.5, color: 'var(--ink-soft)' }}>até</span>
      <input type="date" style=${{ ...S.input, width: 'auto' }} value=${ate} onInput=${(e) => setAte(e.target.value)} />
      <button style=${S.btnPrimary} onClick=${gerar}>Gerar</button>
    </div>
    ${resultado === null ? html`
      <div style=${{ ...S.panel, padding: '32px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, textAlign: 'center' }}>
        <div style=${{ fontSize: 28 }}>🧾</div>
        <div style=${{ fontSize: 13, color: 'var(--ink-soft)' }}>Escolha os filtros e clique em "Gerar".</div>
      </div>
    ` : resultado.length === 0 ? html`<div style=${S.panel}><div style=${S.empty}>Nenhuma entrada encontrada com esses filtros.</div></div>` : html`
      <div style=${{ display: 'flex', justifyContent: 'space-between', background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 14px', marginBottom: 16, maxWidth: 480 }}>
        <div><div style=${{ fontSize: 10.5, color: 'var(--ink-soft)', fontWeight: 600, textTransform: 'uppercase' }}>Produtos analisados</div><div style=${{ fontSize: 16, fontWeight: 700 }}>${resultado.length}</div></div>
        <div style=${{ textAlign: 'right' }}><div style=${{ fontSize: 10.5, color: 'var(--ink-soft)', fontWeight: 600, textTransform: 'uppercase' }}>Total gasto</div><div style=${{ fontSize: 16, fontWeight: 700 }}>${fmtBRL(resultado.reduce((s, p) => s + p.totalGasto, 0))}</div></div>
      </div>
      ${resultado.map((p) => html`
        <div key=${p.codigo} style=${{ marginBottom: 18 }}>
          <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderBottom: '1px solid var(--border)', paddingBottom: 6, marginBottom: 6, flexWrap: 'wrap', gap: '2px 12px' }}>
            <span style=${{ fontWeight: 700, fontSize: 14 }}>${p.produto}</span>
            <span style=${{ fontSize: 12, color: 'var(--ink-soft)' }}>${p.totalQtd} · custo médio ${fmtBRL(p.custoMedio)} · total ${fmtBRL(p.totalGasto)}</span>
          </div>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Data</th><th style=${S.th}>Marca</th><th style=${{ ...S.th, textAlign: 'right' }}>Qtd.</th><th style=${{ ...S.th, textAlign: 'right' }}>Valor unit.</th><th style=${{ ...S.th, textAlign: 'right' }}>Total</th></tr></thead>
            <tbody>
              ${p.compras.map((c, idx) => html`
                <tr key=${idx} style=${{ ...S.tr, cursor: 'default' }}>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${fmtDate(c.data)}</td>
                  <td style=${S.td}>${c.marca || '—'}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}>${c.quantidade}</td>
                  <td style=${{ ...S.td, textAlign: 'right' }}>${c.valor ? fmtBRL(c.valor) : '—'}</td>
                  <td style=${{ ...S.td, textAlign: 'right', fontWeight: 600 }}>${fmtBRL(Number(c.valor || 0) * Number(c.quantidade))}</td>
                </tr>
              `)}
            </tbody>
          </table>
        </div>
      `)}
    `}
  `;
}

const ROLES = { admin: ['Admin', '#4338CA', '#EEF2FF'], operador: ['Operador', '#64748B', '#F1F5F9'] };

function UsuariosScreen() {
  const [lista, setLista] = useState(null);
  const [editando, setEditando] = useState(null);
  const [meuId, setMeuId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');

  async function load() {
    const { data, error } = await sb.from('perfis').select('*').order('nome_exibicao');
    if (error) { setErr('Não foi possível carregar os usuários.'); return; }
    setLista(data || []);
  }
  useEffect(() => {
    load();
    sb.auth.getUser().then(({ data }) => setMeuId(data?.user?.id || null));
  }, []);

  function notify(m) { setMsg(m); setTimeout(() => setMsg(''), 3000); }

  function editar(p) { setEditando({ ...p }); }

  async function salvar(ev) {
    ev.preventDefault();
    if (editando.id === meuId && editando.bloqueado) {
      if (!window.confirm('Você está prestes a bloquear a si mesmo, e vai perder o acesso ao sistema. Continuar?')) return;
    }
    setBusy(true);
    const { error } = await sb.from('perfis').update({
      nome_exibicao: editando.nome_exibicao.trim(),
      role: editando.role,
      bloqueado: editando.bloqueado,
    }).eq('id', editando.id);
    setBusy(false);
    if (error) { setErr('Não foi possível salvar.'); return; }
    await load();
    notify('Usuário atualizado.');
    setEditando(null);
  }

  if (editando) {
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setEditando(null)}>← Usuários</button><h1 style=${S.h1}>Editar usuário</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${salvar}>
          <label style=${S.label}>Nome de exibição</label>
          <input style=${S.input} value=${editando.nome_exibicao || ''} onInput=${(e) => setEditando({ ...editando, nome_exibicao: e.target.value })} required autofocus />
          <label style=${S.label}>E-mail</label>
          <input style=${{ ...S.input, background: 'var(--bg)', color: 'var(--ink-soft)' }} value=${editando.email || ''} disabled />
          <label style=${S.label}>Papel</label>
          <select style=${S.input} value=${editando.role} onChange=${(e) => setEditando({ ...editando, role: e.target.value })}>
            <option value="operador">Operador</option>
            <option value="admin">Admin</option>
          </select>
          <label style=${{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 12.5, color: 'var(--ink-soft)', cursor: 'pointer', marginTop: 14 }}>
            <input type="checkbox" checked=${editando.bloqueado} onChange=${(e) => setEditando({ ...editando, bloqueado: e.target.checked })} style=${{ marginTop: 2 }} />
            <span>Acesso bloqueado (o usuário não consegue mais entrar no sistema)</span>
          </label>
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setEditando(null)}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>Salvar alterações</button>
          </div>
        </form>
      </div>
    `;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Usuários</h1></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}
      <div style=${{ fontSize: 12.5, color: 'var(--ink-soft)', marginBottom: 14, maxWidth: 560 }}>
        Criar uma conta nova ainda precisa ser feito fora daqui (pelo Supabase ou pela aba "Almoxarifado completo") — por segurança, essa tela só edita usuários que já existem.
      </div>
      <div style=${S.panel}>
        <table style=${S.table}>
          <thead><tr><th style=${S.th}>Nome</th><th style=${S.th}>E-mail</th><th style=${S.th}>Papel</th><th style=${S.th}>Status</th></tr></thead>
          <tbody>
            ${lista === null ? null : lista.map((p) => {
              const r = ROLES[p.role] || ROLES.operador;
              return html`
                <tr style=${S.tr} onClick=${() => editar(p)}>
                  <td style=${{ ...S.td, fontWeight: 500 }}>${p.nome_exibicao || '—'} ${p.id === meuId && html`<span style=${{ fontSize: 11, color: 'var(--ink-soft)' }}> (você)</span>`}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${p.email || '—'}</td>
                  <td style=${S.td}><${Badge} label=${r[0]} fg=${r[1]} bg=${r[2]} /></td>
                  <td style=${S.td}>${p.bloqueado ? html`<${Badge} label="Bloqueado" fg="#B91C1C" bg="#FEF2F2" />` : html`<${Badge} label="Ativo" fg="#15803D" bg="#F0FDF4" />`}</td>
                </tr>
              `;
            })}
          </tbody>
        </table>
        ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
        ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhum usuário encontrado.</div>`}
      </div>
    </div>
  `;
}

// =====================================================================
// FROTA — Equipamentos e Manutenções (nativos)

const TIPOS_EQUIP = [['carro', 'Carro'], ['van', 'Van'], ['trator', 'Trator'], ['caminhao', 'Caminhão'], ['maquina_de_corte', 'Máquina de corte'], ['rocadeira', 'Roçadeira'], ['bomba', 'Bomba'], ['outro', 'Outro']];
const STATUS_EQUIP = { ativo: ['Ativo', '#15803D', '#F0FDF4'], em_manutencao: ['Em manutenção', '#B45309', '#FFFBEB'], inativo: ['Inativo', '#64748B', '#F1F5F9'], baixado: ['Baixado', '#B91C1C', '#FEF2F2'] };
const STATUS_MANUT = { aberta: ['Aberta', '#B45309', '#FFFBEB'], em_andamento: ['Em andamento', '#2563EB', '#EFF6FF'], concluida: ['Concluída', '#15803D', '#F0FDF4'], cancelada: ['Cancelada', '#B91C1C', '#FEF2F2'] };
const TIPOS_MANUT = [['preventiva', 'Preventiva'], ['corretiva', 'Corretiva'], ['revisao', 'Revisão']];

function EquipamentosScreen({ role }) {
  const isAdmin = role === 'admin';
  const [lista, setLista] = useState(null);
  const [editando, setEditando] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function load() {
    const { data, error } = await sb.from('equipamentos').select('*').order('nome');
    if (error) { setErr('Não foi possível carregar os equipamentos.'); return; }
    setLista(data || []);
  }
  useEffect(() => { load(); }, []);

  function novo() { setEditando({ nome: '', tipo: 'carro', identificacao: '', modelo: '', ano_fabricacao: '', km_horas_atual: '', status: 'ativo' }); }
  function editar(e) {
    if (!isAdmin) { setErr('Só administradores podem editar equipamentos. Fale com um admin do sistema.'); return; }
    setEditando({ ...e });
  }

  async function salvar(ev) {
    ev.preventDefault();
    if (!editando.nome.trim()) return;
    setBusy(true);
    const payload = {
      nome: editando.nome.trim().toUpperCase(),
      tipo: editando.tipo,
      identificacao: editando.identificacao || null,
      modelo: editando.modelo || null,
      ano_fabricacao: editando.ano_fabricacao ? Number(editando.ano_fabricacao) : null,
      km_horas_atual: editando.km_horas_atual ? Number(editando.km_horas_atual) : null,
      status: editando.status,
    };
    let error;
    if (editando.id) {
      ({ error } = await sb.from('equipamentos').update(payload).eq('id', editando.id));
    } else {
      const { data: userData } = await sb.auth.getUser();
      payload.criado_por = userData?.user?.email || '';
      ({ error } = await sb.from('equipamentos').insert([payload]));
    }
    setBusy(false);
    if (error) { setErr('Não foi possível salvar.'); return; }
    await load();
    setEditando(null);
  }

  if (editando) {
    return html`
      <div style=${S.topbar}><h1 style=${S.h1}>${editando.id ? 'Editar equipamento' : 'Novo equipamento'}</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${salvar}>
          <label style=${S.label}>Nome</label>
          <input style=${S.input} value=${editando.nome} onInput=${(e) => setEditando({ ...editando, nome: e.target.value })} placeholder="ex: Van Fiorino - ABC-1234" required autofocus />
          <div style=${S.row2}>
            <div><label style=${S.label}>Tipo</label>
              <select style=${S.input} value=${editando.tipo} onChange=${(e) => setEditando({ ...editando, tipo: e.target.value })}>
                ${TIPOS_EQUIP.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
              </select>
            </div>
            <div><label style=${S.label}>Identificação</label>
              <input style=${S.input} value=${editando.identificacao || ''} onInput=${(e) => setEditando({ ...editando, identificacao: e.target.value })} placeholder="placa/série" />
            </div>
          </div>
          <div style=${S.row2}>
            <div><label style=${S.label}>Modelo</label>
              <input style=${S.input} value=${editando.modelo || ''} onInput=${(e) => setEditando({ ...editando, modelo: e.target.value })} placeholder="opcional" />
            </div>
            <div><label style=${S.label}>Ano</label>
              <input type="number" style=${S.input} value=${editando.ano_fabricacao || ''} onInput=${(e) => setEditando({ ...editando, ano_fabricacao: e.target.value })} placeholder="opcional" />
            </div>
          </div>
          <div style=${S.row2}>
            <div><label style=${S.label}>Km/horas atual</label>
              <input type="number" step="0.1" style=${S.input} value=${editando.km_horas_atual || ''} onInput=${(e) => setEditando({ ...editando, km_horas_atual: e.target.value })} placeholder="opcional" />
            </div>
            <div><label style=${S.label}>Status</label>
              <select style=${S.input} value=${editando.status} onChange=${(e) => setEditando({ ...editando, status: e.target.value })}>
                ${Object.keys(STATUS_EQUIP).map((k) => html`<option value=${k}>${STATUS_EQUIP[k][0]}</option>`)}
              </select>
            </div>
          </div>
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setEditando(null)}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>${editando.id ? 'Salvar alterações' : 'Cadastrar'}</button>
          </div>
        </form>
      </div>
    `;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Equipamentos</h1>${isAdmin && html`<button style=${S.btnPrimary} onClick=${novo}>+ Novo equipamento</button>`}</div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      <div style=${S.panel}>
        <table style=${S.table}>
          <thead><tr><th style=${S.th}>Nome</th><th style=${S.th}>Tipo</th><th style=${S.th}>Identificação</th><th style=${S.th}>Km/horas</th><th style=${S.th}>Status</th></tr></thead>
          <tbody>
            ${lista === null ? null : lista.map((e) => {
              const st = STATUS_EQUIP[e.status] || STATUS_EQUIP.ativo;
              return html`
                <tr style=${S.tr} onClick=${() => editar(e)}>
                  <td style=${{ ...S.td, fontWeight: 500 }}>${e.nome}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${(TIPOS_EQUIP.find((t) => t[0] === e.tipo) || [e.tipo, e.tipo])[1]}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${e.identificacao || '—'}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${e.km_horas_atual ?? '—'}</td>
                  <td style=${S.td}><${Badge} label=${st[0]} fg=${st[1]} bg=${st[2]} /></td>
                </tr>
              `;
            })}
          </tbody>
        </table>
        ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
        ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhum equipamento cadastrado ainda.</div>`}
      </div>
    </div>
  `;
}

function ManutencoesScreen() {
  const [view, setView] = useState('lista'); // lista | form | detalhe
  const [lista, setLista] = useState(null);
  const [equipamentos, setEquipamentos] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [novo, setNovo] = useState({ equipamento_id: '', tipo: 'preventiva', descricao: '', data: todayISO() });

  async function loadEquip() {
    const { data, error } = await sb.from('equipamentos').select('*').order('nome');
    if (!error) setEquipamentos(data || []);
  }
  async function loadLista() {
    const { data, error } = await sb.from('manutencao_custo_total').select('*');
    if (error) { setErr('Não foi possível carregar. Confirme se o SQL do módulo de frota foi executado.'); return; }
    setLista(data || []);
  }
  useEffect(() => { loadEquip(); loadLista(); }, []);

  const equipMap = useMemo(() => { const m = {}; (equipamentos || []).forEach((e) => (m[e.id] = e)); return m; }, [equipamentos]);

  async function salvarManut(ev) {
    ev.preventDefault();
    if (!novo.equipamento_id || !novo.descricao.trim()) return;
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const { data, error } = await sb.from('manutencoes').insert([{ ...novo, descricao: novo.descricao.trim(), criado_por: userData?.user?.email || '' }]).select().single();
    setBusy(false);
    if (error || !data) { setErr('Não foi possível criar a manutenção.'); return; }
    await loadLista();
    setSelectedId(data.id);
    setView('detalhe');
  }

  if (view === 'form') {
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setView('lista')}>← Manutenções</button><h1 style=${S.h1}>Nova manutenção</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${salvarManut}>
          <label style=${S.label}>Equipamento</label>
          <select style=${S.input} value=${novo.equipamento_id} onChange=${(e) => setNovo({ ...novo, equipamento_id: e.target.value })} required>
            ${(equipamentos || []).map((e) => html`<option value=${e.id}>${e.nome}</option>`)}
          </select>
          <div style=${S.row2}>
            <div><label style=${S.label}>Tipo</label>
              <select style=${S.input} value=${novo.tipo} onChange=${(e) => setNovo({ ...novo, tipo: e.target.value })}>
                ${TIPOS_MANUT.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
              </select>
            </div>
            <div><label style=${S.label}>Data</label>
              <input type="date" style=${S.input} value=${novo.data} onInput=${(e) => setNovo({ ...novo, data: e.target.value })} />
            </div>
          </div>
          <label style=${S.label}>Descrição</label>
          <textarea style=${{ ...S.input, minHeight: 70, resize: 'vertical' }} value=${novo.descricao} onInput=${(e) => setNovo({ ...novo, descricao: e.target.value })} placeholder="ex: Troca de óleo e filtro" required></textarea>
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setView('lista')}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>Abrir manutenção</button>
          </div>
        </form>
      </div>
    `;
  }

  if (view === 'detalhe' && selectedId) {
    return html`<${ManutDetalhe} id=${selectedId} equipamento=${equipMap} onVoltar=${() => { setView('lista'); loadLista(); }} setErr=${setErr} />`;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Manutenções</h1><button style=${S.btnPrimary} onClick=${() => { setNovo({ equipamento_id: (equipamentos || [])[0]?.id || '', tipo: 'preventiva', descricao: '', data: todayISO() }); setView('form'); }} disabled=${!equipamentos || equipamentos.length === 0}>+ Nova manutenção</button></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${!equipamentos || equipamentos.length === 0 ? html`<div style=${S.panel}><div style=${S.empty}>Cadastre um equipamento primeiro, na aba "Equipamentos".</div></div>` : html`
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Equipamento</th><th style=${S.th}>Descrição</th><th style=${S.th}>Status</th><th style=${{ ...S.th, textAlign: 'right' }}>Custo total</th></tr></thead>
            <tbody>
              ${lista === null ? null : lista.map((m) => {
                const st = STATUS_MANUT[m.status] || STATUS_MANUT.aberta;
                const eq = equipMap[m.equipamento_id];
                return html`
                  <tr style=${S.tr} onClick=${() => { setSelectedId(m.manutencao_id); setView('detalhe'); }}>
                    <td style=${{ ...S.td, fontWeight: 500 }}>${eq ? eq.nome : '—'}</td>
                    <td style=${{ ...S.td, whiteSpace: 'normal' }}>${m.descricao}</td>
                    <td style=${S.td}><${Badge} label=${st[0]} fg=${st[1]} bg=${st[2]} /></td>
                    <td style=${{ ...S.td, textAlign: 'right', fontWeight: 600 }}>${fmtBRL(m.custo_total)}</td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
          ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhuma manutenção registrada ainda.</div>`}
        </div>
      `}
    </div>
  `;
}

function ManutDetalhe({ id, equipamento, onVoltar, setErr }) {
  const [manut, setManut] = useState(null);
  const [custos, setCustos] = useState(null);
  const [busy, setBusy] = useState(false);
  const [novoTipo, setNovoTipo] = useState('peca');
  const [novaDescricao, setNovaDescricao] = useState('');
  const [novoPrestador, setNovoPrestador] = useState('');
  const [novaQtd, setNovaQtd] = useState('1');
  const [novoValor, setNovoValor] = useState('');

  async function loadAll() {
    const [{ data: m }, { data: c }] = await Promise.all([
      sb.from('manutencoes').select('*').eq('id', id).single(),
      sb.from('manutencao_custos').select('*').eq('manutencao_id', id).order('created_at'),
    ]);
    setManut(m || null); setCustos(c || []);
  }
  useEffect(() => { loadAll(); }, [id]);

  const total = (custos || []).reduce((s, c) => s + Number(c.valor_total || 0), 0);

  async function addCusto(ev) {
    ev.preventDefault();
    if (!novaDescricao.trim() || !novaQtd || Number(novaQtd) <= 0) return;
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const { error } = await sb.from('manutencao_custos').insert([{
      manutencao_id: id, tipo: novoTipo, descricao: novaDescricao.trim(),
      prestador: novoPrestador.trim() || null, quantidade: Number(novaQtd),
      valor_unitario: Number(novoValor) || 0, criado_por: userData?.user?.email || '',
    }]);
    setBusy(false);
    if (error) { setErr('Não foi possível adicionar o item.'); return; }
    setNovaDescricao(''); setNovoPrestador(''); setNovaQtd('1'); setNovoValor('');
    await loadAll();
  }
  async function removeCusto(c) {
    if (!window.confirm('Remover este item?')) return;
    const { error } = await sb.from('manutencao_custos').delete().eq('id', c.id);
    if (error) { setErr('Não foi possível remover.'); return; }
    await loadAll();
  }
  async function setStatus(status) {
    const patch = { status };
    if (status === 'concluida') patch.data_conclusao = todayISO();
    const { error } = await sb.from('manutencoes').update(patch).eq('id', id);
    if (error) { setErr('Não foi possível atualizar o status.'); return; }
    await loadAll();
  }

  if (!manut) return html`<div style=${S.topbar}><button style=${S.linkBtn} onClick=${onVoltar}>← Manutenções</button></div><div style=${S.content}><div style=${S.panel}><div style=${S.empty}>Carregando…</div></div></div>`;

  const eq = equipamento[manut.equipamento_id];
  const st = STATUS_MANUT[manut.status] || STATUS_MANUT.aberta;

  return html`
    <div style=${S.topbar}>
      <div><button style=${{ ...S.linkBtn, marginBottom: 6, display: 'block' }} onClick=${onVoltar}>← Manutenções</button><h1 style=${S.h1}>${eq ? eq.nome : 'Manutenção'}</h1></div>
      <${Badge} label=${st[0]} fg=${st[1]} bg=${st[2]} />
    </div>
    <div style=${S.content}>
      <div style=${{ ...S.panel, padding: 18, marginBottom: 16 }}>
        <div style=${{ fontSize: 14, fontWeight: 600 }}>${manut.descricao}</div>
        <div style=${{ fontSize: 12.5, color: 'var(--ink-soft)', marginTop: 4 }}>${fmtDate(manut.data)} · ${(TIPOS_MANUT.find((t) => t[0] === manut.tipo) || [manut.tipo])[1]}</div>
        <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 14 }}>
          ${manut.status !== 'em_andamento' && manut.status !== 'concluida' && html`<button style=${S.btnGhost} onClick=${() => setStatus('em_andamento')}>Marcar em andamento</button>`}
          ${manut.status !== 'concluida' && html`<button style=${S.btnGhost} onClick=${() => setStatus('concluida')}>Concluir manutenção</button>`}
          ${manut.status !== 'cancelada' && manut.status !== 'concluida' && html`<button style=${{ ...S.btnGhost, color: 'var(--danger)' }} onClick=${() => setStatus('cancelada')}>Cancelar</button>`}
        </div>
      </div>

      <div style=${S.panel}>
        <div style=${S.panelHeader}><span style=${{ fontWeight: 700, fontSize: 13.5 }}>Peças e serviços</span></div>
        <div style=${{ padding: '4px 18px' }}>
          ${(custos || []).map((c) => html`
            <div key=${c.id} style=${{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 0', borderBottom: '1px solid var(--bg)' }}>
              <span style=${{ fontSize: 10.5, fontWeight: 700, padding: '2px 7px', borderRadius: 999, background: c.tipo === 'peca' ? '#EEF2FF' : '#F0FDF4', color: c.tipo === 'peca' ? '#4338CA' : '#15803D' }}>${c.tipo === 'peca' ? 'PEÇA' : 'SERVIÇO'}</span>
              <div style=${{ flex: 1, minWidth: 0 }}>
                <div style=${{ fontSize: 13, fontWeight: 500 }}>${c.descricao}</div>
                <div style=${{ fontSize: 11.5, color: 'var(--ink-soft)' }}>${c.prestador ? c.prestador + ' · ' : ''}${c.quantidade} × ${fmtBRL(c.valor_unitario)} = ${fmtBRL(c.valor_total)}</div>
              </div>
              <button style=${{ ...S.linkBtn, color: 'var(--danger)' }} onClick=${() => removeCusto(c)}>Remover</button>
            </div>
          `)}
          ${(custos || []).length === 0 && html`<div style=${{ fontSize: 12.5, color: 'var(--ink-soft)', padding: '14px 0' }}>Nada adicionado ainda.</div>`}
        </div>
        <form onSubmit=${addCusto} style=${{ padding: 16, borderTop: '1px solid var(--border)', background: 'var(--bg)' }}>
          <div style=${{ display: 'flex', gap: 4, marginBottom: 10 }}>
            <button type="button" onClick=${() => setNovoTipo('peca')} style=${{ flex: 1, border: '1px solid var(--border)', borderRadius: 7, padding: '7px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', background: novoTipo === 'peca' ? '#EEF2FF' : '#fff', color: novoTipo === 'peca' ? '#4338CA' : 'var(--ink-soft)' }}>Peça</button>
            <button type="button" onClick=${() => setNovoTipo('servico')} style=${{ flex: 1, border: '1px solid var(--border)', borderRadius: 7, padding: '7px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', background: novoTipo === 'servico' ? '#F0FDF4' : '#fff', color: novoTipo === 'servico' ? '#15803D' : 'var(--ink-soft)' }}>Serviço</button>
          </div>
          <input placeholder=${novoTipo === 'peca' ? 'ex: Óleo 15W40, filtro de ar…' : 'ex: Mão de obra, alinhamento…'} value=${novaDescricao} onInput=${(e) => setNovaDescricao(e.target.value)} style=${{ ...S.input, marginBottom: 8 }} required />
          <div style=${{ display: 'flex', gap: 8 }}>
            <input placeholder="prestador (opcional)" value=${novoPrestador} onInput=${(e) => setNovoPrestador(e.target.value)} style=${{ ...S.input, flex: 2 }} />
            <input type="number" min="0.01" step="0.01" placeholder="qtd." value=${novaQtd} onInput=${(e) => setNovaQtd(e.target.value)} style=${{ ...S.input, width: 64 }} />
            <input type="number" min="0" step="0.01" placeholder="R$ unit." value=${novoValor} onInput=${(e) => setNovoValor(e.target.value)} style=${{ ...S.input, width: 100 }} />
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>Adicionar</button>
          </div>
        </form>
      </div>
      <div style=${{ display: 'flex', justifyContent: 'space-between', padding: '16px 4px' }}>
        <span style=${{ fontSize: 13.5, fontWeight: 700 }}>Custo total da manutenção</span>
        <span style=${{ fontSize: 18, fontWeight: 700 }}>${fmtBRL(total)}</span>
      </div>
    </div>
  `;
}

// =====================================================================
// SISTEMA COMPLETO (legado, via iframe)
// =====================================================================
function LegacyFrame() {
  return html`<iframe src="almoxarifado.html" style=${{ width: '100%', height: '100%', border: 'none', display: 'block' }}></iframe>`;
}

// =====================================================================
// CASCA: tela inicial + abas
// =====================================================================
const APPS = [
  { id: 'estoque', title: 'Estoque', icon: '📦', Comp: EstoqueScreen, grupo: 'funcoes' },
  { id: 'lancamento', title: 'Lançamento', icon: '🧾', Comp: LancamentoScreen, grupo: 'funcoes' },
  { id: 'compras', title: 'Compras', icon: '🛒', Comp: ComprasScreen, grupo: 'funcoes' },
  { id: 'manutencoes', title: 'Manutenções', icon: '🛠️', Comp: ManutencoesScreen, grupo: 'funcoes' },
  { id: 'inventario', title: 'Inventário', icon: '📋', Comp: InventarioScreen, grupo: 'funcoes' },
  { id: 'cadastros', title: 'Cadastros', icon: '🗄️', Comp: CadastrosScreen, grupo: 'utilitarios', adminOnly: true },
  { id: 'equipamentos', title: 'Equipamentos', icon: '🚗', Comp: EquipamentosScreen, grupo: 'utilitarios' },
  { id: 'usuarios', title: 'Usuários', icon: '👤', Comp: UsuariosScreen, grupo: 'utilitarios', adminOnly: true },
  { id: 'legado', title: 'Almoxarifado (sistema completo)', icon: '🗂️', Comp: LegacyFrame, grupo: 'utilitarios' },
  { id: 'relatorios', title: 'Relatórios', icon: '📊', Comp: RelatoriosScreen, grupo: 'relatorios' },
];

const GRUPOS = [
  { id: 'funcoes', titulo: 'Funções' },
  { id: 'utilitarios', titulo: 'Utilitários' },
  { id: 'relatorios', titulo: 'Relatórios' },
];
const LIMITE_GRADE = 6; // acima disso, o grupo vira lista em vez de grade de ícones grandes

function Shell({ userEmail, role }) {
  const [tabs, setTabs] = useState([]); // [{id, title, icon}]
  const [activeId, setActiveId] = useState(null); // null = home
  const [homeGrupo, setHomeGrupo] = useState('funcoes'); // categoria ativa na tela inicial
  const isAdmin = role === 'admin';

  function openApp(app) {
    if (app.adminOnly && !isAdmin) return;
    setTabs((prev) => (prev.some((t) => t.id === app.id) ? prev : [...prev, { id: app.id, title: app.title, icon: app.icon }]));
    setActiveId(app.id);
  }
  function closeTab(id, ev) {
    ev.stopPropagation();
    setTabs((prev) => {
      const idx = prev.findIndex((t) => t.id === id);
      const next = prev.filter((t) => t.id !== id);
      if (activeId === id) setActiveId(next.length ? next[Math.max(0, idx - 1)].id : null);
      return next;
    });
  }

  return html`
    <div style=${{ height: '100vh', display: 'flex', flexDirection: 'column', fontFamily: F }}>
      <div style=${{ display: 'flex', alignItems: 'center', background: 'var(--sidebar)', height: 46, flexShrink: 0, paddingRight: 12 }}>
        <button
          onClick=${() => setActiveId(null)}
          title="Tela inicial"
          style=${{ width: 46, height: 46, flexShrink: 0, background: activeId === null ? 'rgba(255,255,255,0.08)' : 'transparent', border: 'none', color: '#fff', fontSize: 18, cursor: 'pointer' }}
        >☰</button>
        <div style=${{ display: 'flex', overflowX: 'auto', height: '100%', flex: 1 }}>
          ${tabs.map((t) => html`
            <div
              key=${t.id}
              onClick=${() => setActiveId(t.id)}
              style=${{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 14px', height: '100%', cursor: 'pointer', background: activeId === t.id ? 'var(--bg)' : 'transparent', color: activeId === t.id ? 'var(--ink)' : '#B7BFCE', fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap', borderRight: '1px solid rgba(255,255,255,0.08)' }}
            >
              <span>${t.icon}</span><span>${t.title}</span>
              <span onClick=${(e) => closeTab(t.id, e)} style=${{ marginLeft: 4, opacity: 0.6, fontSize: 15, lineHeight: 1 }}>✕</span>
            </div>
          `)}
        </div>
        <div style=${{ color: '#8892A6', fontSize: 12, marginRight: 12 }}>${userEmail}</div>
        <button onClick=${() => sb.auth.signOut()} style=${{ background: 'none', border: '1px solid #374158', borderRadius: 6, color: '#B7BFCE', fontSize: 11.5, fontWeight: 600, padding: '6px 10px', cursor: 'pointer' }}>Sair</button>
      </div>

      <div style=${{ flex: 1, minHeight: 0, position: 'relative' }}>
        <div style=${{ display: activeId === null ? 'block' : 'none', height: '100%', overflowY: 'auto' }}>
          <div style=${{ padding: '40px 28px', maxWidth: 760, margin: '0 auto' }}>
            <h1 style=${{ fontSize: 22, fontWeight: 700, margin: '0 0 4px', textAlign: 'center' }}>Início</h1>
            <p style=${{ fontSize: 13, color: 'var(--ink-soft)', margin: '0 0 24px', textAlign: 'center' }}>Dê duplo clique numa opção para abrir.</p>

            <div style=${{ display: 'flex', justifyContent: 'center', gap: 28, borderBottom: '1px solid var(--border)', marginBottom: 28 }}>
              ${GRUPOS.map((g) => html`
                <button
                  key=${g.id}
                  onClick=${() => setHomeGrupo(g.id)}
                  style=${{ background: 'none', border: 'none', cursor: 'pointer', padding: '0 2px 12px', fontSize: 14, fontWeight: 600, color: homeGrupo === g.id ? 'var(--accent)' : 'var(--ink-soft)', borderBottom: homeGrupo === g.id ? '2px solid var(--accent)' : '2px solid transparent', marginBottom: -1 }}
                >${g.titulo}</button>
              `)}
            </div>

            ${(() => {
              const appsDoGrupo = APPS.filter((a) => a.grupo === homeGrupo && (!a.adminOnly || isAdmin));
              const usarLista = appsDoGrupo.length > LIMITE_GRADE;
              if (appsDoGrupo.length === 0) {
                return html`<div style=${{ textAlign: 'center', fontSize: 12.5, color: 'var(--ink-soft)', fontStyle: 'italic', padding: '20px 0' }}>Nenhuma tela aqui ainda.</div>`;
              }
              if (usarLista) {
                return html`
                  <div style=${{ maxWidth: 420, margin: '0 auto', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden', background: '#fff' }}>
                    ${appsDoGrupo.map((app) => html`
                      <div key=${app.id} ondblclick=${() => openApp(app)}
                        style=${{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderBottom: '1px solid var(--bg)', cursor: 'pointer', userSelect: 'none' }}>
                        <span style=${{ fontSize: 18 }}>${app.icon}</span>
                        <span style=${{ fontSize: 13.5, fontWeight: 500 }}>${app.title}</span>
                      </div>
                    `)}
                  </div>
                `;
              }
              return html`
                <div style=${{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: 16 }}>
                  ${appsDoGrupo.map((app) => html`
                    <div key=${app.id} ondblclick=${() => openApp(app)}
                      style=${{ width: 150, background: '#fff', border: '1px solid var(--border)', borderRadius: 12, padding: '22px 12px', textAlign: 'center', cursor: 'pointer', userSelect: 'none' }}>
                      <div style=${{ fontSize: 30, marginBottom: 10 }}>${app.icon}</div>
                      <div style=${{ fontSize: 13, fontWeight: 600 }}>${app.title}</div>
                    </div>
                  `)}
                </div>
              `;
            })()}
          </div>
        </div>

        ${tabs.map((t) => {
          const app = APPS.find((a) => a.id === t.id);
          return html`
            <div key=${t.id} style=${{ display: activeId === t.id ? 'flex' : 'none', flexDirection: 'column', height: '100%' }}>
              <${app.Comp} role=${role} />
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

// =====================================================================
// RAIZ
// =====================================================================
function Root() {
  const [session, setSession] = useState(undefined);
  const [perfil, setPerfil] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setPerfil(session === null ? null : undefined); return; }
    sb.from('perfis').select('role, bloqueado').eq('id', session.user.id).single().then(({ data }) => {
      setPerfil(data || { role: 'operador', bloqueado: false });
    });
  }, [session]);

  if (session === undefined) return html`<div style=${{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: 'var(--ink-soft)' }}>Carregando…</div>`;
  if (session === null) return html`<${Login} />`;
  if (perfil === undefined) return html`<div style=${{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: 'var(--ink-soft)' }}>Carregando…</div>`;
  if (perfil.bloqueado) {
    return html`
      <div style=${{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
        <div style=${{ textAlign: 'center', maxWidth: 340 }}>
          <div style=${{ fontSize: 32, marginBottom: 12 }}>🔒</div>
          <div style=${{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Acesso bloqueado</div>
          <div style=${{ fontSize: 13, color: 'var(--ink-soft)', marginBottom: 18 }}>Sua conta foi bloqueada por um administrador. Fale com quem gerencia o sistema se isso for um engano.</div>
          <button style=${S.btnGhost} onClick=${() => sb.auth.signOut()}>Sair</button>
        </div>
      </div>
    `;
  }
  return html`<${Shell} userEmail=${session.user.email} role=${perfil.role} />`;
}

render(html`<${Root} />`, document.getElementById('root'));
</script>
</body>
</html>
