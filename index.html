<script type="module">

// SHELL PRINCIPAL — tela inicial com ícones + sistema de abas
// =====================================================================

// Inventário, Usuários, Relatórios) continua rodando 100% como está,
// dentro de uma aba "Almoxarifado (sistema completo)" via iframe —
// ninguém perde acesso a nada enquanto reconstruímos aos poucos.
// As telas já reconstruídas (Lançamento, Equipamentos, Manutenções)
// rodam nativas, fora do iframe.
// =====================================================================
import { h, render } from 'https://esm.sh/preact@10.19.6';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.19.6/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const html = htm.bind(h);
const sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---------- helpers ----------
function fmtDate(d) { if (!d) return '-'; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function fmtBRL(v) { return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function normalize(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }

const F = "'Inter', -apple-system, sans-serif";

// ---------- estilos compartilhados ----------
const S = {
  input: { width: '100%', border: '1px solid var(--border)', borderRadius: 7, padding: '9px 11px', fontSize: 13.5, color: 'var(--ink)', fontFamily: 'inherit', background: '#fff', boxSizing: 'border-box' },
  label: { fontSize: 12, fontWeight: 600, color: 'var(--ink-soft)', margin: '10px 0 6px', display: 'block' },
  row2: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 },
  btnPrimary: { display: 'inline-flex', alignItems: 'center', gap: 6, background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 7, padding: '9px 15px', fontWeight: 600, fontSize: 13, cursor: 'pointer' },
  btnGhost: { display: 'inline-flex', alignItems: 'center', gap: 6, background: '#fff', color: 'var(--ink)', border: '1px solid var(--border)', borderRadius: 7, padding: '9px 15px', fontWeight: 600, fontSize: 13, cursor: 'pointer' },
  linkBtn: { background: 'none', border: 'none', color: 'var(--accent)', fontWeight: 600, fontSize: 12.5, cursor: 'pointer' },
  panel: { background: '#fff', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden' },
  panelHeader: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 18px', borderBottom: '1px solid var(--border)' },
  table: { width: '100%', borderCollapse: 'collapse', fontSize: 13.5 },
  th: { textAlign: 'left', padding: '10px 18px', fontSize: 11.5, fontWeight: 600, color: 'var(--ink-soft)', textTransform: 'uppercase', letterSpacing: '0.03em', borderBottom: '1px solid var(--border)', whiteSpace: 'nowrap' },
  tr: { borderBottom: '1px solid var(--border)', cursor: 'pointer' },
  td: { padding: '12px 18px', color: 'var(--ink)', whiteSpace: 'nowrap' },
  empty: { padding: '40px 18px', textAlign: 'center', color: 'var(--ink-soft)', fontSize: 13.5 },
  formCard: { background: '#fff', border: '1px solid var(--border)', borderRadius: 10, padding: 20, maxWidth: 560 },
  topbar: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', padding: '22px 28px 18px', flexShrink: 0, gap: 12, flexWrap: 'wrap' },
  h1: { fontSize: 20, fontWeight: 700, color: 'var(--ink)', margin: 0 },
  content: { padding: '0 28px 28px', flex: 1, overflowY: 'auto' },
  toast: { position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', background: 'var(--ink)', color: '#fff', padding: '10px 18px', borderRadius: 8, fontSize: 13, boxShadow: '0 6px 20px rgba(0,0,0,0.25)', zIndex: 9000 },
  errBox: { background: 'var(--danger-soft)', border: '1px solid #FECACA', color: '#991B1B', borderRadius: 8, padding: '10px 14px', fontSize: 13, marginBottom: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
};

function Badge({ label, fg, bg }) {
  return html`<span style=${{ fontSize: 11, fontWeight: 700, padding: '2px 9px', borderRadius: 999, color: fg, background: bg, whiteSpace: 'nowrap' }}>${label}</span>`;
}

// =====================================================================
// LOGIN
// =====================================================================
function Login() {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(ev) {
    ev.preventDefault();
    setErr(''); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
    setBusy(false);
    if (error) setErr('E-mail ou senha incorretos.');
  }

  return html`
    <div style=${{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <form onSubmit=${submit} style=${{ background: '#fff', border: '1px solid var(--border)', borderRadius: 14, padding: '32px 28px', width: 380, maxWidth: '100%', boxShadow: '0 8px 30px rgba(0,0,0,0.08)' }}>
        <div style=${{ width: 40, height: 40, borderRadius: 10, background: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, marginBottom: 14 }}>📦</div>
        <h1 style=${{ fontSize: 19, fontWeight: 700, margin: '0 0 4px' }}>Sistema</h1>
        <p style=${{ fontSize: 13, color: 'var(--ink-soft)', margin: '0 0 20px' }}>Entre com sua conta de funcionário.</p>
        ${err && html`<div style=${S.errBox}>${err}</div>`}
        <label style=${S.label}>E-mail</label>
        <input type="email" value=${email} onInput=${(e) => setEmail(e.target.value)} style=${S.input} required autofocus />
        <label style=${S.label}>Senha</label>
        <input type="password" value=${senha} onInput=${(e) => setSenha(e.target.value)} style=${S.input} required />
        <button type="submit" style=${{ ...S.btnPrimary, width: '100%', justifyContent: 'center', marginTop: 18, padding: '11px 0' }} disabled=${busy}>${busy ? 'Entrando…' : 'Entrar'}</button>
      </form>
    </div>
  `;
}

// =====================================================================
// SELETOR DE PRODUTO (usado no Lançamento)
// =====================================================================
function ProdutoPicker({ produtos, value, onChange }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const selected = (produtos || []).find((p) => p.codigo === Number(value));
  const label = open ? query : selected ? `#${String(selected.codigo).padStart(3, '0')} · ${selected.produto}` : '';
  const results = useMemo(() => {
    const q = normalize(query);
    const list = produtos || [];
    if (!q) return list.slice(0, 40);
    return list.filter((p) => normalize(p.produto).includes(q) || String(p.codigo).includes(query)).slice(0, 40);
  }, [produtos, query]);
  return html`
    <div style=${{ position: 'relative' }}>
      <input
        style=${S.input}
        placeholder="Buscar produto…"
        value=${label}
        onFocus=${(e) => { setOpen(true); setQuery(''); e.target.select(); }}
        onInput=${(e) => { setQuery(e.target.value); setOpen(true); }}
        onBlur=${() => setTimeout(() => setOpen(false), 150)}
      />
      ${open && html`
        <div style=${{ position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, boxShadow: '0 10px 30px rgba(0,0,0,0.12)', maxHeight: 220, overflowY: 'auto', zIndex: 20 }}>
          ${results.length === 0 && html`<div style=${{ padding: 12, fontSize: 12.5, color: 'var(--ink-soft)' }}>Nenhum produto encontrado.</div>`}
          ${results.map((p) => html`
            <div key=${p.codigo} onMouseDown=${() => { onChange(p.codigo); setOpen(false); }}
              style=${{ padding: '8px 12px', cursor: 'pointer', borderBottom: '1px solid var(--bg)', fontSize: 13 }}>
              <div style=${{ fontWeight: 500 }}>${p.produto}</div>
              <div style=${{ fontSize: 11, color: 'var(--ink-soft)' }}>#${String(p.codigo).padStart(3, '0')} · saldo ${p.saldo ?? '—'} ${p.unidade || ''}</div>
            </div>
          `)}
        </div>
      `}
    </div>
  `;
}

// =====================================================================
// TELA: LANÇAMENTO
// =====================================================================
function LancamentoScreen() {
  const [produtos, setProdutos] = useState(null);
  const [tipo, setTipo] = useState('entrada');
  const [codigo, setCodigo] = useState('');
  const [quantidade, setQuantidade] = useState('');
  const [valor, setValor] = useState('');
  const [marca, setMarca] = useState('');
  const [data, setData] = useState(todayISO());
  const [lote, setLote] = useState('');
  const [validade, setValidade] = useState('');
  const [motivoEntrada, setMotivoEntrada] = useState('compra');
  const [areaFinalidade, setAreaFinalidade] = useState('');
  const [solicitante, setSolicitante] = useState('');
  const [notaFiscal, setNotaFiscal] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');

  async function loadProdutos() {
    const { data, error } = await sb.from('product_balances').select('*');
    if (!error) setProdutos(data || []);
  }
  useEffect(() => { loadProdutos(); }, []);

  const produtoSel = (produtos || []).find((p) => p.codigo === Number(codigo));

  function resetForm() {
    setCodigo(''); setQuantidade(''); setValor(''); setMarca('');
    setLote(''); setValidade(''); setAreaFinalidade(''); setSolicitante(''); setNotaFiscal('');
  }

  async function submit(ev) {
    ev.preventDefault();
    setErr(''); setMsg('');
    if (!produtoSel || !quantidade || Number(quantidade) <= 0) { setErr('Escolha um produto e informe a quantidade.'); return; }
    if (tipo === 'saida') {
      if (!areaFinalidade.trim()) { setErr('Informe a área/finalidade da saída.'); return; }
      if (Number(quantidade) > Number(produtoSel.saldo)) { setErr(`Saldo insuficiente: "${produtoSel.produto}" tem ${produtoSel.saldo} em estoque.`); return; }
    }
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const criado_por = userData?.user?.email || '';
    const payload = {
      data,
      tipo,
      codigo: produtoSel.codigo,
      produto: produtoSel.produto,
      quantidade: Number(quantidade),
      valor: Number(valor) || 0,
      valor_total: Number(((Number(valor) || 0) * Number(quantidade)).toFixed(2)),
      marca: marca.trim().toUpperCase(),
      categoria: produtoSel.categoria,
      nota_fiscal: notaFiscal.trim(),
      criado_por,
    };
    if (tipo === 'entrada') {
      payload.lote = lote.trim().toUpperCase();
      payload.validade = validade || null;
      payload.motivo_entrada = motivoEntrada;
    } else {
      payload.area_finalidade = areaFinalidade.trim().toUpperCase();
      payload.solicitante = solicitante.trim().toUpperCase();
    }
    const { error } = await sb.from('movements').insert([payload]);
    setBusy(false);
    if (error) { setErr('Não foi possível salvar o lançamento.'); return; }
    await loadProdutos();
    setMsg(`${tipo === 'entrada' ? 'Entrada' : 'Saída'} registrada: ${produtoSel.produto}`);
    resetForm();
    setTimeout(() => setMsg(''), 3000);
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Lançamento</h1></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${msg && html`<div style=${{ ...S.errBox, background: 'var(--success-soft)', border: '1px solid #BBF7D0', color: 'var(--success)' }}>${msg}</div>`}
      <form style=${S.formCard} onSubmit=${submit}>
        <div style=${{ display: 'flex', border: '1px solid var(--border)', borderRadius: 7, overflow: 'hidden', marginBottom: 4 }}>
          <button type="button" onClick=${() => setTipo('entrada')} style=${{ flex: 1, border: 'none', padding: '9px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', background: tipo === 'entrada' ? 'var(--success-soft)' : '#fff', color: tipo === 'entrada' ? 'var(--success)' : 'var(--ink-soft)' }}>Entrada</button>
          <button type="button" onClick=${() => setTipo('saida')} style=${{ flex: 1, border: 'none', padding: '9px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', background: tipo === 'saida' ? 'var(--danger-soft)' : '#fff', color: tipo === 'saida' ? 'var(--danger)' : 'var(--ink-soft)' }}>Saída</button>
        </div>

        <label style=${S.label}>Produto</label>
        <${ProdutoPicker} produtos=${produtos} value=${codigo} onChange=${setCodigo} />

        <div style=${S.row2}>
          <div>
            <label style=${S.label}>Quantidade</label>
            <input type="number" min="0.01" step="0.01" value=${quantidade} onInput=${(e) => setQuantidade(e.target.value)} style=${S.input} required />
          </div>
          <div>
            <label style=${S.label}>Valor unitário</label>
            <input type="number" min="0" step="0.01" value=${valor} onInput=${(e) => setValor(e.target.value)} style=${S.input} placeholder="opcional" />
          </div>
        </div>

        <label style=${S.label}>Marca</label>
        <input value=${marca} onInput=${(e) => setMarca(e.target.value)} style=${S.input} placeholder="opcional" />

        ${tipo === 'entrada' ? html`
          <label style=${S.label}>Motivo da entrada</label>
          <select style=${S.input} value=${motivoEntrada} onChange=${(e) => setMotivoEntrada(e.target.value)}>
            <option value="compra">Compra</option>
            <option value="doacao">Doação</option>
            <option value="devolucao">Devolução</option>
            <option value="outro">Outro</option>
          </select>
          <div style=${S.row2}>
            <div>
              <label style=${S.label}>Lote</label>
              <input value=${lote} onInput=${(e) => setLote(e.target.value)} style=${S.input} placeholder="opcional" />
            </div>
            <div>
              <label style=${S.label}>Validade</label>
              <input type="date" value=${validade} onInput=${(e) => setValidade(e.target.value)} style=${S.input} />
            </div>
          </div>
        ` : html`
          <div style=${S.row2}>
            <div>
              <label style=${S.label}>Área / Finalidade *</label>
              <input value=${areaFinalidade} onInput=${(e) => setAreaFinalidade(e.target.value)} style=${S.input} required />
            </div>
            <div>
              <label style=${S.label}>Solicitante</label>
              <input value=${solicitante} onInput=${(e) => setSolicitante(e.target.value)} style=${S.input} placeholder="opcional" />
            </div>
          </div>
        `}

        <div style=${S.row2}>
          <div>
            <label style=${S.label}>Data</label>
            <input type="date" value=${data} onInput=${(e) => setData(e.target.value)} style=${S.input} />
          </div>
          <div>
            <label style=${S.label}>Nota fiscal</label>
            <input value=${notaFiscal} onInput=${(e) => setNotaFiscal(e.target.value)} style=${S.input} placeholder="opcional" />
          </div>
        </div>

        <div style=${{ display: 'flex', justifyContent: 'flex-end', marginTop: 18 }}>
          <button type="submit" style=${S.btnPrimary} disabled=${busy}>${busy ? 'Salvando…' : 'Registrar'}</button>
        </div>
      </form>
    </div>
  `;
}

// =====================================================================
// FROTA — Equipamentos e Manutenções (nativos)
// =====================================================================
const TIPOS_EQUIP = [['carro', 'Carro'], ['van', 'Van'], ['trator', 'Trator'], ['caminhao', 'Caminhão'], ['maquina_de_corte', 'Máquina de corte'], ['rocadeira', 'Roçadeira'], ['bomba', 'Bomba'], ['outro', 'Outro']];
const STATUS_EQUIP = { ativo: ['Ativo', '#15803D', '#F0FDF4'], em_manutencao: ['Em manutenção', '#B45309', '#FFFBEB'], inativo: ['Inativo', '#64748B', '#F1F5F9'], baixado: ['Baixado', '#B91C1C', '#FEF2F2'] };
const STATUS_MANUT = { aberta: ['Aberta', '#B45309', '#FFFBEB'], em_andamento: ['Em andamento', '#2563EB', '#EFF6FF'], concluida: ['Concluída', '#15803D', '#F0FDF4'], cancelada: ['Cancelada', '#B91C1C', '#FEF2F2'] };
const TIPOS_MANUT = [['preventiva', 'Preventiva'], ['corretiva', 'Corretiva'], ['revisao', 'Revisão']];

function EquipamentosScreen() {
  const [lista, setLista] = useState(null);
  const [editando, setEditando] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function load() {
    const { data, error } = await sb.from('equipamentos').select('*').order('nome');
    if (error) { setErr('Não foi possível carregar os equipamentos.'); return; }
    setLista(data || []);
  }
  useEffect(() => { load(); }, []);

  function novo() { setEditando({ nome: '', tipo: 'carro', identificacao: '', modelo: '', ano_fabricacao: '', km_horas_atual: '', status: 'ativo' }); }

  async function salvar(ev) {
    ev.preventDefault();
    if (!editando.nome.trim()) return;
    setBusy(true);
    const payload = {
      nome: editando.nome.trim().toUpperCase(),
      tipo: editando.tipo,
      identificacao: editando.identificacao || null,
      modelo: editando.modelo || null,
      ano_fabricacao: editando.ano_fabricacao ? Number(editando.ano_fabricacao) : null,
      km_horas_atual: editando.km_horas_atual ? Number(editando.km_horas_atual) : null,
      status: editando.status,
    };
    let error;
    if (editando.id) {
      ({ error } = await sb.from('equipamentos').update(payload).eq('id', editando.id));
    } else {
      const { data: userData } = await sb.auth.getUser();
      payload.criado_por = userData?.user?.email || '';
      ({ error } = await sb.from('equipamentos').insert([payload]));
    }
    setBusy(false);
    if (error) { setErr('Não foi possível salvar.'); return; }
    await load();
    setEditando(null);
  }

  if (editando) {
    return html`
      <div style=${S.topbar}><h1 style=${S.h1}>${editando.id ? 'Editar equipamento' : 'Novo equipamento'}</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${salvar}>
          <label style=${S.label}>Nome</label>
          <input style=${S.input} value=${editando.nome} onInput=${(e) => setEditando({ ...editando, nome: e.target.value })} placeholder="ex: Van Fiorino - ABC-1234" required autofocus />
          <div style=${S.row2}>
            <div><label style=${S.label}>Tipo</label>
              <select style=${S.input} value=${editando.tipo} onChange=${(e) => setEditando({ ...editando, tipo: e.target.value })}>
                ${TIPOS_EQUIP.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
              </select>
            </div>
            <div><label style=${S.label}>Identificação</label>
              <input style=${S.input} value=${editando.identificacao || ''} onInput=${(e) => setEditando({ ...editando, identificacao: e.target.value })} placeholder="placa/série" />
            </div>
          </div>
          <div style=${S.row2}>
            <div><label style=${S.label}>Modelo</label>
              <input style=${S.input} value=${editando.modelo || ''} onInput=${(e) => setEditando({ ...editando, modelo: e.target.value })} placeholder="opcional" />
            </div>
            <div><label style=${S.label}>Ano</label>
              <input type="number" style=${S.input} value=${editando.ano_fabricacao || ''} onInput=${(e) => setEditando({ ...editando, ano_fabricacao: e.target.value })} placeholder="opcional" />
            </div>
          </div>
          <div style=${S.row2}>
            <div><label style=${S.label}>Km/horas atual</label>
              <input type="number" step="0.1" style=${S.input} value=${editando.km_horas_atual || ''} onInput=${(e) => setEditando({ ...editando, km_horas_atual: e.target.value })} placeholder="opcional" />
            </div>
            <div><label style=${S.label}>Status</label>
              <select style=${S.input} value=${editando.status} onChange=${(e) => setEditando({ ...editando, status: e.target.value })}>
                ${Object.keys(STATUS_EQUIP).map((k) => html`<option value=${k}>${STATUS_EQUIP[k][0]}</option>`)}
              </select>
            </div>
          </div>
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setEditando(null)}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>${editando.id ? 'Salvar alterações' : 'Cadastrar'}</button>
          </div>
        </form>
      </div>
    `;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Equipamentos</h1><button style=${S.btnPrimary} onClick=${novo}>+ Novo equipamento</button></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      <div style=${S.panel}>
        <table style=${S.table}>
          <thead><tr><th style=${S.th}>Nome</th><th style=${S.th}>Tipo</th><th style=${S.th}>Identificação</th><th style=${S.th}>Km/horas</th><th style=${S.th}>Status</th></tr></thead>
          <tbody>
            ${lista === null ? null : lista.map((e) => {
              const st = STATUS_EQUIP[e.status] || STATUS_EQUIP.ativo;
              return html`
                <tr style=${S.tr} onClick=${() => setEditando({ ...e })}>
                  <td style=${{ ...S.td, fontWeight: 500 }}>${e.nome}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${(TIPOS_EQUIP.find((t) => t[0] === e.tipo) || [e.tipo, e.tipo])[1]}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${e.identificacao || '—'}</td>
                  <td style=${{ ...S.td, color: 'var(--ink-soft)' }}>${e.km_horas_atual ?? '—'}</td>
                  <td style=${S.td}><${Badge} label=${st[0]} fg=${st[1]} bg=${st[2]} /></td>
                </tr>
              `;
            })}
          </tbody>
        </table>
        ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
        ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhum equipamento cadastrado ainda.</div>`}
      </div>
    </div>
  `;
}

function ManutencoesScreen() {
  const [view, setView] = useState('lista'); // lista | form | detalhe
  const [lista, setLista] = useState(null);
  const [equipamentos, setEquipamentos] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [novo, setNovo] = useState({ equipamento_id: '', tipo: 'preventiva', descricao: '', data: todayISO() });

  async function loadEquip() {
    const { data, error } = await sb.from('equipamentos').select('*').order('nome');
    if (!error) setEquipamentos(data || []);
  }
  async function loadLista() {
    const { data, error } = await sb.from('manutencao_custo_total').select('*');
    if (error) { setErr('Não foi possível carregar. Confirme se o SQL do módulo de frota foi executado.'); return; }
    setLista(data || []);
  }
  useEffect(() => { loadEquip(); loadLista(); }, []);

  const equipMap = useMemo(() => { const m = {}; (equipamentos || []).forEach((e) => (m[e.id] = e)); return m; }, [equipamentos]);

  async function salvarManut(ev) {
    ev.preventDefault();
    if (!novo.equipamento_id || !novo.descricao.trim()) return;
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const { data, error } = await sb.from('manutencoes').insert([{ ...novo, descricao: novo.descricao.trim(), criado_por: userData?.user?.email || '' }]).select().single();
    setBusy(false);
    if (error || !data) { setErr('Não foi possível criar a manutenção.'); return; }
    await loadLista();
    setSelectedId(data.id);
    setView('detalhe');
  }

  if (view === 'form') {
    return html`
      <div style=${S.topbar}><button style=${{ ...S.linkBtn, marginRight: 10 }} onClick=${() => setView('lista')}>← Manutenções</button><h1 style=${S.h1}>Nova manutenção</h1></div>
      <div style=${S.content}>
        <form style=${S.formCard} onSubmit=${salvarManut}>
          <label style=${S.label}>Equipamento</label>
          <select style=${S.input} value=${novo.equipamento_id} onChange=${(e) => setNovo({ ...novo, equipamento_id: e.target.value })} required>
            ${(equipamentos || []).map((e) => html`<option value=${e.id}>${e.nome}</option>`)}
          </select>
          <div style=${S.row2}>
            <div><label style=${S.label}>Tipo</label>
              <select style=${S.input} value=${novo.tipo} onChange=${(e) => setNovo({ ...novo, tipo: e.target.value })}>
                ${TIPOS_MANUT.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
              </select>
            </div>
            <div><label style=${S.label}>Data</label>
              <input type="date" style=${S.input} value=${novo.data} onInput=${(e) => setNovo({ ...novo, data: e.target.value })} />
            </div>
          </div>
          <label style=${S.label}>Descrição</label>
          <textarea style=${{ ...S.input, minHeight: 70, resize: 'vertical' }} value=${novo.descricao} onInput=${(e) => setNovo({ ...novo, descricao: e.target.value })} placeholder="ex: Troca de óleo e filtro" required></textarea>
          <div style=${{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 18 }}>
            <button type="button" style=${S.btnGhost} onClick=${() => setView('lista')}>Cancelar</button>
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>Abrir manutenção</button>
          </div>
        </form>
      </div>
    `;
  }

  if (view === 'detalhe' && selectedId) {
    return html`<${ManutDetalhe} id=${selectedId} equipamento=${equipMap} onVoltar=${() => { setView('lista'); loadLista(); }} setErr=${setErr} />`;
  }

  return html`
    <div style=${S.topbar}><h1 style=${S.h1}>Manutenções</h1><button style=${S.btnPrimary} onClick=${() => { setNovo({ equipamento_id: (equipamentos || [])[0]?.id || '', tipo: 'preventiva', descricao: '', data: todayISO() }); setView('form'); }} disabled=${!equipamentos || equipamentos.length === 0}>+ Nova manutenção</button></div>
    <div style=${S.content}>
      ${err && html`<div style=${S.errBox}><span>${err}</span><button style=${S.linkBtn} onClick=${() => setErr('')}>fechar</button></div>`}
      ${!equipamentos || equipamentos.length === 0 ? html`<div style=${S.panel}><div style=${S.empty}>Cadastre um equipamento primeiro, na aba "Equipamentos".</div></div>` : html`
        <div style=${S.panel}>
          <table style=${S.table}>
            <thead><tr><th style=${S.th}>Equipamento</th><th style=${S.th}>Descrição</th><th style=${S.th}>Status</th><th style=${{ ...S.th, textAlign: 'right' }}>Custo total</th></tr></thead>
            <tbody>
              ${lista === null ? null : lista.map((m) => {
                const st = STATUS_MANUT[m.status] || STATUS_MANUT.aberta;
                const eq = equipMap[m.equipamento_id];
                return html`
                  <tr style=${S.tr} onClick=${() => { setSelectedId(m.manutencao_id); setView('detalhe'); }}>
                    <td style=${{ ...S.td, fontWeight: 500 }}>${eq ? eq.nome : '—'}</td>
                    <td style=${{ ...S.td, whiteSpace: 'normal' }}>${m.descricao}</td>
                    <td style=${S.td}><${Badge} label=${st[0]} fg=${st[1]} bg=${st[2]} /></td>
                    <td style=${{ ...S.td, textAlign: 'right', fontWeight: 600 }}>${fmtBRL(m.custo_total)}</td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
          ${lista === null && html`<div style=${S.empty}>Carregando…</div>`}
          ${lista && lista.length === 0 && html`<div style=${S.empty}>Nenhuma manutenção registrada ainda.</div>`}
        </div>
      `}
    </div>
  `;
}

function ManutDetalhe({ id, equipamento, onVoltar, setErr }) {
  const [manut, setManut] = useState(null);
  const [custos, setCustos] = useState(null);
  const [busy, setBusy] = useState(false);
  const [novoTipo, setNovoTipo] = useState('peca');
  const [novaDescricao, setNovaDescricao] = useState('');
  const [novoPrestador, setNovoPrestador] = useState('');
  const [novaQtd, setNovaQtd] = useState('1');
  const [novoValor, setNovoValor] = useState('');

  async function loadAll() {
    const [{ data: m }, { data: c }] = await Promise.all([
      sb.from('manutencoes').select('*').eq('id', id).single(),
      sb.from('manutencao_custos').select('*').eq('manutencao_id', id).order('created_at'),
    ]);
    setManut(m || null); setCustos(c || []);
  }
  useEffect(() => { loadAll(); }, [id]);

  const total = (custos || []).reduce((s, c) => s + Number(c.valor_total || 0), 0);

  async function addCusto(ev) {
    ev.preventDefault();
    if (!novaDescricao.trim() || !novaQtd || Number(novaQtd) <= 0) return;
    setBusy(true);
    const { data: userData } = await sb.auth.getUser();
    const { error } = await sb.from('manutencao_custos').insert([{
      manutencao_id: id, tipo: novoTipo, descricao: novaDescricao.trim(),
      prestador: novoPrestador.trim() || null, quantidade: Number(novaQtd),
      valor_unitario: Number(novoValor) || 0, criado_por: userData?.user?.email || '',
    }]);
    setBusy(false);
    if (error) { setErr('Não foi possível adicionar o item.'); return; }
    setNovaDescricao(''); setNovoPrestador(''); setNovaQtd('1'); setNovoValor('');
    await loadAll();
  }
  async function removeCusto(c) {
    if (!window.confirm('Remover este item?')) return;
    const { error } = await sb.from('manutencao_custos').delete().eq('id', c.id);
    if (error) { setErr('Não foi possível remover.'); return; }
    await loadAll();
  }
  async function setStatus(status) {
    const patch = { status };
    if (status === 'concluida') patch.data_conclusao = todayISO();
    const { error } = await sb.from('manutencoes').update(patch).eq('id', id);
    if (error) { setErr('Não foi possível atualizar o status.'); return; }
    await loadAll();
  }

  if (!manut) return html`<div style=${S.topbar}><button style=${S.linkBtn} onClick=${onVoltar}>← Manutenções</button></div><div style=${S.content}><div style=${S.panel}><div style=${S.empty}>Carregando…</div></div></div>`;

  const eq = equipamento[manut.equipamento_id];
  const st = STATUS_MANUT[manut.status] || STATUS_MANUT.aberta;

  return html`
    <div style=${S.topbar}>
      <div><button style=${{ ...S.linkBtn, marginBottom: 6, display: 'block' }} onClick=${onVoltar}>← Manutenções</button><h1 style=${S.h1}>${eq ? eq.nome : 'Manutenção'}</h1></div>
      <${Badge} label=${st[0]} fg=${st[1]} bg=${st[2]} />
    </div>
    <div style=${S.content}>
      <div style=${{ ...S.panel, padding: 18, marginBottom: 16 }}>
        <div style=${{ fontSize: 14, fontWeight: 600 }}>${manut.descricao}</div>
        <div style=${{ fontSize: 12.5, color: 'var(--ink-soft)', marginTop: 4 }}>${fmtDate(manut.data)} · ${(TIPOS_MANUT.find((t) => t[0] === manut.tipo) || [manut.tipo])[1]}</div>
        <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 14 }}>
          ${manut.status !== 'em_andamento' && manut.status !== 'concluida' && html`<button style=${S.btnGhost} onClick=${() => setStatus('em_andamento')}>Marcar em andamento</button>`}
          ${manut.status !== 'concluida' && html`<button style=${S.btnGhost} onClick=${() => setStatus('concluida')}>Concluir manutenção</button>`}
          ${manut.status !== 'cancelada' && manut.status !== 'concluida' && html`<button style=${{ ...S.btnGhost, color: 'var(--danger)' }} onClick=${() => setStatus('cancelada')}>Cancelar</button>`}
        </div>
      </div>

      <div style=${S.panel}>
        <div style=${S.panelHeader}><span style=${{ fontWeight: 700, fontSize: 13.5 }}>Peças e serviços</span></div>
        <div style=${{ padding: '4px 18px' }}>
          ${(custos || []).map((c) => html`
            <div key=${c.id} style=${{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 0', borderBottom: '1px solid var(--bg)' }}>
              <span style=${{ fontSize: 10.5, fontWeight: 700, padding: '2px 7px', borderRadius: 999, background: c.tipo === 'peca' ? '#EEF2FF' : '#F0FDF4', color: c.tipo === 'peca' ? '#4338CA' : '#15803D' }}>${c.tipo === 'peca' ? 'PEÇA' : 'SERVIÇO'}</span>
              <div style=${{ flex: 1, minWidth: 0 }}>
                <div style=${{ fontSize: 13, fontWeight: 500 }}>${c.descricao}</div>
                <div style=${{ fontSize: 11.5, color: 'var(--ink-soft)' }}>${c.prestador ? c.prestador + ' · ' : ''}${c.quantidade} × ${fmtBRL(c.valor_unitario)} = ${fmtBRL(c.valor_total)}</div>
              </div>
              <button style=${{ ...S.linkBtn, color: 'var(--danger)' }} onClick=${() => removeCusto(c)}>Remover</button>
            </div>
          `)}
          ${(custos || []).length === 0 && html`<div style=${{ fontSize: 12.5, color: 'var(--ink-soft)', padding: '14px 0' }}>Nada adicionado ainda.</div>`}
        </div>
        <form onSubmit=${addCusto} style=${{ padding: 16, borderTop: '1px solid var(--border)', background: 'var(--bg)' }}>
          <div style=${{ display: 'flex', gap: 4, marginBottom: 10 }}>
            <button type="button" onClick=${() => setNovoTipo('peca')} style=${{ flex: 1, border: '1px solid var(--border)', borderRadius: 7, padding: '7px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', background: novoTipo === 'peca' ? '#EEF2FF' : '#fff', color: novoTipo === 'peca' ? '#4338CA' : 'var(--ink-soft)' }}>Peça</button>
            <button type="button" onClick=${() => setNovoTipo('servico')} style=${{ flex: 1, border: '1px solid var(--border)', borderRadius: 7, padding: '7px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', background: novoTipo === 'servico' ? '#F0FDF4' : '#fff', color: novoTipo === 'servico' ? '#15803D' : 'var(--ink-soft)' }}>Serviço</button>
          </div>
          <input placeholder=${novoTipo === 'peca' ? 'ex: Óleo 15W40, filtro de ar…' : 'ex: Mão de obra, alinhamento…'} value=${novaDescricao} onInput=${(e) => setNovaDescricao(e.target.value)} style=${{ ...S.input, marginBottom: 8 }} required />
          <div style=${{ display: 'flex', gap: 8 }}>
            <input placeholder="prestador (opcional)" value=${novoPrestador} onInput=${(e) => setNovoPrestador(e.target.value)} style=${{ ...S.input, flex: 2 }} />
            <input type="number" min="0.01" step="0.01" placeholder="qtd." value=${novaQtd} onInput=${(e) => setNovaQtd(e.target.value)} style=${{ ...S.input, width: 64 }} />
            <input type="number" min="0" step="0.01" placeholder="R$ unit." value=${novoValor} onInput=${(e) => setNovoValor(e.target.value)} style=${{ ...S.input, width: 100 }} />
            <button type="submit" style=${S.btnPrimary} disabled=${busy}>Adicionar</button>
          </div>
        </form>
      </div>
      <div style=${{ display: 'flex', justifyContent: 'space-between', padding: '16px 4px' }}>
        <span style=${{ fontSize: 13.5, fontWeight: 700 }}>Custo total da manutenção</span>
        <span style=${{ fontSize: 18, fontWeight: 700 }}>${fmtBRL(total)}</span>
      </div>
    </div>
  `;
}

// =====================================================================
// SISTEMA COMPLETO (legado, via iframe)

function LegacyFrame() {
  return html`<iframe src="almoxarifado.html" style=${{ width: '100%', height: '100%', border: 'none', display: 'block' }}></iframe>`;
}

// =====================================================================
// CASCA: tela inicial + abas
// =====================================================================
const APPS = [
  { id: 'lancamento', title: 'Lançamento', icon: '🧾', Comp: LancamentoScreen },
  { id: 'equipamentos', title: 'Equipamentos', icon: '🚗', Comp: EquipamentosScreen },
  { id: 'manutencoes', title: 'Manutenções', icon: '🛠️', Comp: ManutencoesScreen },
  { id: 'legado', title: 'Almoxarifado (sistema completo)', icon: '📦', Comp: LegacyFrame },
];

function Shell({ userEmail }) {
  const [tabs, setTabs] = useState([]); // [{id, title, icon}]
  const [activeId, setActiveId] = useState(null); // null = home

  function openApp(app) {
    setTabs((prev) => (prev.some((t) => t.id === app.id) ? prev : [...prev, { id: app.id, title: app.title, icon: app.icon }]));
    setActiveId(app.id);
  }
  function closeTab(id, ev) {
    ev.stopPropagation();
    setTabs((prev) => {
      const idx = prev.findIndex((t) => t.id === id);
      const next = prev.filter((t) => t.id !== id);
      if (activeId === id) setActiveId(next.length ? next[Math.max(0, idx - 1)].id : null);
      return next;
    });
  }

  return html`
    <div style=${{ height: '100vh', display: 'flex', flexDirection: 'column', fontFamily: F }}>
      <div style=${{ display: 'flex', alignItems: 'center', background: 'var(--sidebar)', height: 46, flexShrink: 0, paddingRight: 12 }}>
        <button
          onClick=${() => setActiveId(null)}
          title="Tela inicial"
          style=${{ width: 46, height: 46, flexShrink: 0, background: activeId === null ? 'rgba(255,255,255,0.08)' : 'transparent', border: 'none', color: '#fff', fontSize: 18, cursor: 'pointer' }}
        >☰</button>
        <div style=${{ display: 'flex', overflowX: 'auto', height: '100%', flex: 1 }}>
          ${tabs.map((t) => html`
            <div
              key=${t.id}
              onClick=${() => setActiveId(t.id)}
              style=${{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 14px', height: '100%', cursor: 'pointer', background: activeId === t.id ? 'var(--bg)' : 'transparent', color: activeId === t.id ? 'var(--ink)' : '#B7BFCE', fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap', borderRight: '1px solid rgba(255,255,255,0.08)' }}
            >
              <span>${t.icon}</span><span>${t.title}</span>
              <span onClick=${(e) => closeTab(t.id, e)} style=${{ marginLeft: 4, opacity: 0.6, fontSize: 15, lineHeight: 1 }}>✕</span>
            </div>
          `)}
        </div>
        <div style=${{ color: '#8892A6', fontSize: 12, marginRight: 12 }}>${userEmail}</div>
        <button onClick=${() => sb.auth.signOut()} style=${{ background: 'none', border: '1px solid #374158', borderRadius: 6, color: '#B7BFCE', fontSize: 11.5, fontWeight: 600, padding: '6px 10px', cursor: 'pointer' }}>Sair</button>
      </div>

      <div style=${{ flex: 1, minHeight: 0, position: 'relative' }}>
        <div style=${{ display: activeId === null ? 'block' : 'none', height: '100%', overflowY: 'auto' }}>
          <div style=${{ padding: '40px 28px' }}>
            <h1 style=${{ fontSize: 22, fontWeight: 700, margin: '0 0 4px' }}>Início</h1>
            <p style=${{ fontSize: 13, color: 'var(--ink-soft)', margin: '0 0 28px' }}>Dê duplo clique numa opção para abrir.</p>
            <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: 16, maxWidth: 720 }}>
              ${APPS.map((app) => html`
                <div
                  key=${app.id}
                  ondblclick=${() => openApp(app)}
                  style=${{ background: '#fff', border: '1px solid var(--border)', borderRadius: 12, padding: '22px 16px', textAlign: 'center', cursor: 'pointer', userSelect: 'none' }}
                >
                  <div style=${{ fontSize: 30, marginBottom: 10 }}>${app.icon}</div>
                  <div style=${{ fontSize: 13, fontWeight: 600 }}>${app.title}</div>
                </div>
              `)}
            </div>
          </div>
        </div>

        ${tabs.map((t) => {
          const app = APPS.find((a) => a.id === t.id);
          return html`
            <div key=${t.id} style=${{ display: activeId === t.id ? 'flex' : 'none', flexDirection: 'column', height: '100%' }}>
              <${app.Comp} />
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

// =====================================================================
// RAIZ
// =====================================================================
function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) return html`<div style=${{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: 'var(--ink-soft)' }}>Carregando…</div>`;
  if (session === null) return html`<${Login} />`;
  return html`<${Shell} userEmail=${session.user.email} />`;
}

render(html`<${Root} />`, document.getElementById('root'));
</script>
</body>
</html>
