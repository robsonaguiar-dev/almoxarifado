name: Ping Supabase (evitar pausa por inatividade)

on:
  schedule:
    # roda a cada 3 dias às 12:00 UTC — bem dentro da margem dos 7 dias
    # que o Supabase gratuito usa pra pausar projetos sem uso
    - cron: "0 12 */3 * *"
  workflow_dispatch: # também dá pra rodar manualmente pela aba "Actions" do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://anypxsjelqwwekkdhlab.supabase.co/rest/v1/products?select=codigo&limit=1" \
            -H "apikey: sb_publishable_t7C4iPwbN-1zANNLEouHvQ_oHKSb6m6"
